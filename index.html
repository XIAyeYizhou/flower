<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<meta name="description" content="一个字卡聊天网页：我直接打字，对方从字卡里挑一张或拼 1–3 张回复，也可以使用我准备的表情包。">
<title>字卡交流</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D46847'/%3E%3Cpath d='M20 28c2-5 7-5 9 0M35 28c2-5 7-5 9 0M24 38c4 6 12 6 16 0' fill='none' stroke='%23FFF8F0' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F6F3EE;
  --surface:#FFFEFB;
  --surface-alt:#F4F0E9;
  --ink:#2D2823;
  --muted:#8C8277;
  --faint:#AFA397;
  --line:#E7E0D6;
  --accent:#D46847;
  --accent-dark:#BC5838;
  --accent-soft:#FAE8DF;
  --danger:#B24D32;
  --radius:14px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
  background:#ECE8E1;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--accent-soft);color:var(--ink)}

.app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100dvh;
  max-height:932px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:var(--bg);
  border:1px solid #E1D9CE;
  border-radius:18px;
  box-shadow:0 12px 40px rgba(54,40,26,.08);
}
.view{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* ——— Header ——— */
.topbar{
  position:relative;
  z-index:30;
  flex:none;
  height:calc(60px + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) 12px 0;
  display:flex;
  align-items:center;
  gap:7px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.contact-btn{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  gap:9px;
  padding:3px 4px;
  border-radius:10px;
  text-align:left;
}
.contact-btn:hover{background:var(--surface-alt)}
.avatar{
  width:38px;
  height:38px;
  flex:none;
  overflow:hidden;
  border-radius:50%;
  background:#E7E0D6;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.contact-copy{display:flex;flex-direction:column;min-width:0;gap:2px}
.contact-name{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--ink);
  font-size:15px;
  line-height:1.25;
  font-weight:650;
}
.contact-sub{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--muted);
  font-size:10px;
  line-height:1.25;
}
.edit-pencil{width:12px;height:12px;flex:none;color:#B4A89B;margin-left:1px}
.top-actions{display:flex;align-items:center;gap:3px;flex:none}
.moments-btn{
  height:32px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:0 10px;
  border-radius:16px;
  border:1px solid var(--line);
  background:var(--surface);
  color:#62584E;
  font-size:11px;
  font-weight:550;
}
.moments-btn:hover{background:var(--surface-alt)}
.moments-btn svg{width:14px;height:14px;color:#8C7F71}
.more-btn,
.mail-btn{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#7F7468;
}
.more-btn:hover,
.mail-btn:hover{background:var(--surface-alt)}
.more-btn svg,
.mail-btn svg{width:17px;height:17px}
.mail-btn{position:relative}
.mail-badge{
  position:absolute;
  top:-1px;
  right:-2px;
  min-width:14px;
  height:14px;
  padding:0 3px;
  display:grid;
  place-items:center;
  border-radius:7px;
  border:1.5px solid var(--surface);
  background:var(--accent);
  color:#fff;
  font-size:8px;
  font-weight:650;
  line-height:1;
}
.menu{
  position:absolute;
  z-index:60;
  top:calc(100% - 5px);
  right:10px;
  width:158px;
  display:flex;
  flex-direction:column;
  padding:5px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 10px 28px rgba(53,39,26,.13);
}
.menu button{
  height:37px;
  padding:0 10px;
  border-radius:8px;
  text-align:left;
  color:#453D35;
  font-size:12px;
}
.menu button:hover{background:var(--surface-alt)}
.menu button.danger{color:var(--danger)}
.menu-separator{height:1px;background:var(--line);margin:4px 6px}

/* ——— Chat ——— */
.chat{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  gap:9px;
  padding:13px 14px 18px;
  scrollbar-width:none;
}
.chat::-webkit-scrollbar{display:none}
.day-chip{
  align-self:center;
  margin:2px 0 3px;
  color:var(--faint);
  font-size:10px;
  line-height:1.2;
}
.msg{display:flex;align-items:flex-end;gap:8px;min-width:0}
.msg.them{justify-content:flex-start;padding-right:28px}
.msg.me{justify-content:flex-end;padding-left:52px}
.msg.group-start{margin-top:3px}
.msg.enter{animation:fadeUp .2s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg-avatar{
  width:28px;
  height:28px;
  flex:none;
  overflow:hidden;
  border-radius:50%;
  background:#E7E0D6;
  margin-bottom:1px;
}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.avatar-spacer{width:28px;flex:none;height:1px}
.msg-body{display:flex;flex-direction:column;min-width:0;max-width:min(82%,310px)}
.msg.me .msg-body{align-items:flex-end}

.card-bubble{
  max-width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px 8px 8px;
  border:1px solid var(--line);
  border-radius:4px 14px 14px 14px;
  background:var(--surface);
}
.card-emoji{
  width:36px;
  height:36px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:var(--surface-alt);
  font-size:20px;
  line-height:1;
}
.card-copy{display:flex;flex-direction:column;gap:1px;min-width:0}
.card-kind{color:var(--faint);font-size:8px;line-height:1.2;letter-spacing:.08em}
.card-word{
  color:var(--ink);
  font-size:16px;
  line-height:1.3;
  font-weight:600;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.card-bubble.no-emoji{padding-left:12px}
.card-bubble.combo{background:#FFF8F1;border-color:#EAD6C6}
.card-bubble.combo .card-kind{color:var(--accent)}
.card-bubble.combo .card-word{font-size:14px;line-height:1.45}
.card-message{display:flex;flex-direction:column;gap:4px;max-width:100%}
.card-intent{
  margin:0;
  padding:0 3px;
  color:#8B7C6F;
  font-size:9.5px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.card-intent-label{display:block;margin-bottom:1px;color:#B4A69A;font-size:7.5px;line-height:1.3;letter-spacing:.06em}
.card-intent-block{padding:0 3px}
.card-intent-line{margin:0;color:#8B7C6F;font-size:9px;line-height:1.5;overflow-wrap:anywhere}
.card-intent-line b{margin-right:4px;color:#A65B47;font-weight:600}
.decision-bubble{
  max-width:100%;
  padding:10px 12px;
  border:1px solid #E8D3C3;
  border-radius:16px 4px 16px 16px;
  background:#FFFBF6;
}
.decision-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.decision-tag{
  display:inline-flex;
  align-items:center;
  height:16px;
  padding:0 6px;
  border-radius:4px;
  background:var(--accent-soft);
  color:var(--accent-dark);
  font-size:8px;
  line-height:1;
  font-weight:600;
  letter-spacing:.05em;
}
.decision-count-label{margin-left:auto;color:var(--muted);font-size:8px;line-height:1}
.decision-question{
  margin:0 0 8px;
  color:var(--ink);
  font-size:14.5px;
  line-height:1.45;
  font-weight:600;
  overflow-wrap:anywhere;
}
.decision-options{display:flex;flex-direction:column;gap:4px}
.decision-option{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 7px;
  border:1px solid #EDE3D9;
  border-radius:7px;
  background:#fff;
  color:#5A4F45;
  font-size:11.5px;
  line-height:1.35;
}
.decision-letter{
  width:16px;
  height:16px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--surface-alt);
  color:#8B7D70;
  font-size:8px;
  line-height:1;
  font-weight:600;
}
.decision-option-text{min-width:0;overflow-wrap:anywhere}
.decision-answer-bubble{
  max-width:100%;
  padding:9px 12px 10px;
  border:1px solid var(--line);
  border-radius:4px 16px 16px 16px;
  background:#FFF9F3;
}
.decision-answer-question{
  margin:0 0 6px;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
  overflow-wrap:anywhere;
}
.decision-answer-line{display:flex;align-items:center;gap:7px}
.decision-check{
  width:20px;
  height:20px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:11px;
  line-height:1;
  font-weight:700;
}
.decision-answer-text{
  color:var(--ink);
  font-size:14.5px;
  line-height:1.4;
  font-weight:600;
  overflow-wrap:anywhere;
}
.heart-bubble{
  display:flex;
  align-items:center;
  gap:7px;
  padding:9px 13px;
  border:1px solid #F0D4CD;
  border-radius:16px 4px 16px 16px;
  background:#FCEBE7;
  color:#9D463B;
  font-size:12.5px;
  line-height:1.3;
  font-weight:600;
}
.heart-glyph{font-size:19px;line-height:1;animation:heartBeat 1.4s ease-in-out infinite}
@keyframes heartBeat{0%,100%{transform:scale(1)}18%{transform:scale(1.16)}34%{transform:scale(.98)}50%{transform:scale(1.1)}}
.heart-burst{position:absolute;inset:0;z-index:90;overflow:hidden;pointer-events:none}
.heart-particle{
  position:absolute;
  bottom:92px;
  left:50%;
  opacity:0;
  font-size:18px;
  line-height:1;
  animation:heartFloat 1.35s ease-out forwards;
}
@keyframes heartFloat{
  0%{opacity:0;transform:translate(-50%,10px) scale(.6)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-190px) scale(1.25)}
}
.text-bubble{
  max-width:100%;
  padding:9px 13px;
  border-radius:16px 4px 16px 16px;
  background:var(--accent);
  color:#fff;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.sticker-bubble{
  width:112px;
  height:112px;
  margin:1px 0;
  display:grid;
  place-items:center;
  animation:fadeIn .2s ease both;
}
.sticker-bubble img{width:100%;height:100%;object-fit:contain;border-radius:12px;-webkit-user-drag:none;user-select:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.chat-note{
  align-self:center;
  max-width:94%;
  margin:5px 0 2px;
  padding:0 8px;
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  text-align:center;
}
.asset-warning{
  display:flex;
  align-items:center;
  gap:8px;
  margin:3px 0 1px;
  padding:8px 10px;
  border:1px dashed #DCC7B5;
  border-radius:10px;
  background:#FCF7F0;
  color:#8B7B6B;
  font-size:10px;
  line-height:1.5;
}
.asset-warning > span{flex:1;min-width:0}
.asset-warning button{
  flex:none;
  color:var(--accent-dark);
  font-size:10.5px;
  font-weight:600;
}
.typing-row{display:flex;align-items:flex-end;gap:8px;padding-right:28px}
.typing-bubble{
  height:34px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:4px 14px 14px 14px;
  background:var(--surface);
}
.typing-text{color:var(--muted);font-size:9.5px;white-space:nowrap}
.typing-dots{display:flex;align-items:center;gap:3px}
.typing-dots span{width:4px;height:4px;border-radius:50%;background:#C4B7A9;animation:dot 1.1s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.14s}
.typing-dots span:nth-child(3){animation-delay:.28s}
@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

/* ——— Composer ——— */
.composer{
  flex:none;
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:7px 12px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  border-top:1px solid var(--line);
}
.tools{display:flex;align-items:center;gap:6px;padding:0 1px}
.tool-btn{
  height:26px;
  display:flex;
  align-items:center;
  gap:5px;
  padding:0 8px;
  border-radius:6px;
  background:var(--surface-alt);
  color:#6E6358;
  font-size:10.5px;
  line-height:1;
}
.tool-btn:hover{background:#EDE7DE}
.tool-btn svg{width:12px;height:12px;color:#94867A}
.tool-count{color:#A19588;font-size:9px}
.tool-note{margin-left:auto;color:var(--faint);font-size:9px;letter-spacing:.01em}
.input-row{display:flex;align-items:center;gap:7px}
.input-wrap{
  flex:1;
  min-width:0;
  height:42px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#F7F4EF;
  transition:border-color .16s,background .16s;
}
.input-wrap:focus-within{border-color:#D7B7A5;background:var(--surface)}
.input-wrap input{
  width:100%;
  min-width:0;
  border:0;
  outline:none;
  background:transparent;
  color:var(--ink);
  font-size:14px;
  line-height:1.2;
}
.input-wrap input::placeholder{color:#A79A8D}
.send-btn{
  width:56px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#E1D9CF;
  color:#8E8276;
  font-size:11.5px;
  line-height:1;
  font-weight:600;
  letter-spacing:.02em;
  touch-action:manipulation;
  transition:background .16s,color .16s,transform .16s;
}
.send-btn.enabled{background:var(--accent);color:#fff}
.send-btn.enabled:hover{background:var(--accent-dark)}
.send-btn:active{transform:scale(.96)}
.send-btn:disabled{cursor:default;opacity:.75}

/* ——— Moments ——— */
.moments-topbar{
  position:relative;
  height:calc(54px + env(safe-area-inset-top,0px));
  display:flex;
  align-items:center;
  gap:6px;
  padding:env(safe-area-inset-top,0px) 12px 0;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  flex:none;
}
.back-btn{
  width:32px;
  height:32px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#5E544A;
}
.back-btn:hover{background:var(--surface-alt)}
.back-btn svg{width:17px;height:17px}
.moments-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  margin:0;
  font-size:15px;
  line-height:1.2;
  font-weight:650;
  color:var(--ink);
  white-space:nowrap;
}
.publish-btn{
  flex:none;
  margin-left:auto;
  height:30px;
  padding:0 10px;
  border-radius:8px;
  background:var(--accent-soft);
  color:var(--accent-dark);
  font-size:11px;
  font-weight:600;
}
.publish-btn:hover{background:#F5DCD1}
.moments-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--bg);
  scrollbar-width:none;
}
.moments-scroll::-webkit-scrollbar{display:none}
.moments-profile{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  padding:17px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.profile-avatar{width:50px;height:50px;flex:none;border-radius:50%;object-fit:cover;background:#E7E0D6}
.profile-copy{flex:1;min-width:0}
.profile-copy strong{display:block;color:var(--ink);font-size:15px;font-weight:650;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-copy span{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.3}
.moment-list{background:var(--surface)}
.moment{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.moment-avatar{width:34px;height:34px;flex:none;border-radius:50%;object-fit:cover;background:#E7E0D6}
.me-avatar{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#E9E2D7;
  color:#7B6E60;
  font-size:11px;
  font-weight:600;
}
.moment-main{flex:1;min-width:0}
.moment-author{margin:0 0 4px;color:#5A4F45;font-size:12px;line-height:1.3;font-weight:600}
.moment-text{margin:0;color:var(--ink);font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.moment-text:empty{display:none}
.moment-photo{
  width:100%;
  aspect-ratio:4 / 3;
  object-fit:cover;
  margin:7px 0 4px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--surface-alt);
}
.moment-sticker{
  width:136px;
  height:136px;
  margin:7px 0 4px;
  padding:8px;
  border-radius:8px;
  background:#FAF5EC;
  border:1px solid var(--line);
}
.moment-sticker img{width:100%;height:100%;object-fit:contain}
.moment-meta{display:flex;align-items:center;gap:10px;margin-top:7px;color:var(--faint);font-size:9.5px;line-height:1}
.moment-like,
.moment-dislike,
.moment-comment-btn{
  display:flex;
  align-items:center;
  gap:3px;
  color:var(--faint);
  font-size:9.5px;
  line-height:1;
}
.moment-like svg,
.moment-dislike svg,
.moment-comment-btn svg{width:13px;height:13px}
.moment-like.liked{color:var(--accent)}
.moment-dislike.disliked{color:#8A5A45}
.moment-comment-btn.active{color:var(--accent)}
.moment-delete{margin-left:auto;color:var(--faint);font-size:9.5px;line-height:1}
.moment-delete:hover{color:var(--danger)}
.moment-comments{
  margin-top:8px;
  padding:8px 10px;
  border-radius:8px;
  background:#F7F3EC;
}
.moment-comment{
  color:#5D5248;
  font-size:10.5px;
  line-height:1.65;
  overflow-wrap:anywhere;
}
.moment-comment + .moment-comment{margin-top:3px}
.moment-comment b{margin-right:5px;color:#443B33;font-weight:600}
.comment-form{display:flex;align-items:center;gap:6px;margin-top:7px}
.moment-comments .comment-form:first-child{margin-top:0}
.comment-input{
  flex:1;
  min-width:0;
  height:30px;
  padding:0 8px;

}

.moments-empty{padding:52px 24px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;background:var(--surface)}

/* ——— Mailbox ——— */
.mail-scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  background:var(--bg);
  scrollbar-width:none;
}
.mail-scroll::-webkit-scrollbar{display:none}
.mail-status{

  align-items:center;
  gap:9px;
  padding:11px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.mail-status-icon{
  width:28px;
  height:28px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--surface-alt);
  color:#9A8B7C;
}

.mail-status-copy{display:flex;flex-direction:column;gap:2px;min-width:0}

.mail-status-copy span{color:var(--muted);font-size:9px;line-height:1.3}
.letter-list{background:var(--surface)}
.letter{padding:14px 16px;border-bottom:1px solid var(--line)}
.letter-head{display:flex;align-items:center;gap:8px}
.letter-avatar{width:30px;height:30px;flex:none;border-radius:50%;object-fit:cover;background:#E7E0D6}
.letter .me-avatar{width:30px;height:30px;font-size:10px}
.letter-head-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.letter-author{color:#5A4F45;font-size:11.5px;line-height:1.25;font-weight:600}
.letter-meta{color:var(--faint);font-size:9px;line-height:1.25}
.letter-paper{
  margin-top:8px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#FBF8F2;
}
.letter-cards{display:flex;flex-wrap:wrap;gap:5px}
.letter-card{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#FFFDF9;
  color:#40372F;

}
.letter-card-emoji{font-size:14px;line-height:1}
.letter-text{
  margin:0;
  color:#40372F;
  font-size:12.5px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.mail-empty{
  padding:48px 24px;
  text-align:center;
  color:var(--muted);
  font-size:11.5px;
  line-height:1.7;
}
.mail-empty strong{display:block;margin-bottom:5px;color:#61564B;font-size:13px;font-weight:600}

/* ——— Overlays and sheets ——— */
.overlay{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:flex-end;
  background:rgba(35,30,24,.32);
}
.sheet{
  width:100%;
  max-height:86%;
  display:flex;
  flex-direction:column;
  padding:10px 16px calc(15px + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  border-radius:18px 18px 0 0;
  box-shadow:0 -10px 30px rgba(52,38,25,.13);
  animation:sheetIn .22s var(--ease) both;
}
.sheet:focus{outline:none}
@keyframes sheetIn{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.grabber{width:34px;height:4px;flex:none;margin:0 auto 13px;border-radius:2px;background:#E3D9CD}
.sheet-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 2px 10px}
.sheet-head h2{margin:0;color:var(--ink);font-size:17px;line-height:1.3;font-weight:650;letter-spacing:-.01em}
.sheet-sub{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.5}
.close-btn{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--surface-alt);color:#7C7064}

.close-btn svg{width:12px;height:12px}
.sheet-body{min-height:0;overflow-y:auto;padding:0 2px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-actions{flex:none;display:flex;gap:8px;padding-top:14px}
.btn{
  flex:1;
  height:43px;
  border-radius:11px;
  background:var(--surface-alt);
  color:#4D433A;
  font-size:12.5px;
  font-weight:550;
}
.btn:hover{background:#EDE7DE}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark)}
.btn.danger{background:#FBEAE4;color:var(--danger)}
.btn:disabled{opacity:.42;cursor:default}

/* Collection */
.collection-sheet{height:72%;max-height:680px;transition:height .16s var(--ease)}
.collection-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 9px}
.tabs{display:flex;gap:2px;padding:2px;border-radius:8px;background:var(--surface-alt)}
.tab{

.add-btn{

.inline-form{

}

.emoji-picker{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:8px}
.emoji-btn{

  background:#fff;

}

.custom-emoji-input:focus{border-color:#D7B7A5}
.custom-emoji-add{
  height:28px;
  flex:none;
  padding:0 9px;
  border-radius:6px;
  background:var(--surface-alt);
  color:#7E7062;
  font-size:9.5px;
  font-weight:550;
}
.custom-emoji-add:hover{background:#EFE4D8}
.intent-field{display:flex;align-items:center;gap:6px;margin-top:7px}
.intent-label{flex:none;color:#9B8D80;font-size:8.5px}
.intent-input{
  flex:1;
  min-width:0;
  height:30px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:7px;
  outline:none;
  background:#fff;
  color:var(--ink);
  font-size:10.5px;
}
.intent-input:focus{border-color:#D7B7A5}

.group-picker{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;margin-top:8px}

.group-choices{display:flex;flex:1;min-width:0;flex-wrap:wrap;gap:5px}
.group-choice{
  height:24px;
  padding:0 8px;
  border:1px solid var(--line);

  color:#8B7E71;
  font-size:9.5px;
  line-height:1;
}

.group-add{
  height:24px;
  flex:none;
  padding:0 7px;
  border:1px dashed #D5C4B4;
  border-radius:6px;
  background:transparent;
  color:#A29587;
  font-size:9.5px;
  line-height:1;
}
.group-add:hover{background:#fff;border-color:#C7B29E;color:#7E7062}
.new-group-form{display:flex;align-items:center;gap:5px;margin-top:7px}
.group-input{
  flex:1;
  min-width:0;
  height:29px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:6px;
  outline:none;
  background:#fff;
  font-size:11px;
}
.group-input:focus{border-color:#D7B7A5}
.group-save{
  height:29px;
  flex:none;
  padding:0 9px;
  border-radius:6px;
  background:var(--accent);
  color:#fff;
  font-size:9.5px;
  font-weight:550;
}
.group-cancel{
  height:29px;
  flex:none;
  padding:0 7px;
  border-radius:6px;
  background:var(--surface-alt);
  color:#8B7E71;
  font-size:9.5px;
}
.form-hint{margin:7px 1px 0;color:var(--faint);font-size:8.5px;line-height:1.4}
.collection-body{flex:1;min-height:0;overflow-y:auto;padding:1px 2px 2px;scrollbar-width:none}
.collection-body::-webkit-scrollbar{display:none}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:8px}
.card-group-heading{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  gap:5px;
  min-height:17px;
  margin:4px 1px 0;

  font-size:9.5px;
  line-height:1.2;

}
.card-group-heading:first-child{margin-top:0}
.card-group-heading::before{content:"";width:4px;height:4px;border-radius:50%;background:#C3B3A3;flex:none}
.group-count{color:#B1A599;font-size:8.5px;font-weight:400}
.group-line{flex:1;height:1px;background:var(--line);margin-left:2px}
.library-card:focus-visible{outline:2px solid #D9A78E;outline-offset:1px}
.library-card.no-emoji{padding-left:11px}
.library-card.long{
  grid-column:1/-1;
  height:auto;
  min-height:58px;
  padding-top:9px;
  padding-bottom:9px;
}

.library-card{
  position:relative;
  height:64px;
  min-width:0;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:7px;
  padding:8px 24px 8px 9px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  text-align:left;
}

  flex:1;
  min-width:0;
  max-width:100%;
  color:var(--ink);
  font-size:11.5px;
  line-height:1.3;
  font-weight:550;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  overflow-wrap:anywhere;
}

  position:absolute;

  right:4px;

}

.sticker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:8px}

  background:var(--surface);
}

  border-radius:10px;

}

.empty-state{

  min-height:180px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:20px;
  border:1px dashed #D9C9B9;
  border-radius:10px;
  color:var(--muted);
  text-align:center;
  font-size:10.5px;
  line-height:1.6;
}

.empty-state button{
  margin-top:2px;
  padding:6px 10px;
  border-radius:6px;
  background:var(--accent-soft);
  color:var(--accent-dark);

  font-weight:600;
}

}

.text-link{color:var(--muted);font-size:9.5px;text-decoration:underline;text-underline-offset:2px}

.settings-intro{margin:0 0 4px;color:var(--muted);font-size:10px;line-height:1.55}
.setting-block{padding:13px 2px;border-bottom:1px solid var(--line)}

.setting-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.setting-title{margin:0;color:#4E443A;font-size:12px;line-height:1.4;font-weight:600}
.setting-hint{margin:4px 0 0;color:var(--muted);font-size:9.5px;line-height:1.5}

}

.love-note-card{
  margin:2px 0 4px;
  padding:22px 18px 17px;
  border:1px solid #F0D9D1;
  border-radius:15px;
  background:#FFF8F4;
  text-align:center;
}
.love-note-eyebrow{display:block;color:#AE8E82;font-size:8.5px;letter-spacing:.08em}
.love-note-text{
  margin:13px 0 14px;
  color:#6B5146;
  font-size:15px;
  line-height:1.75;
  font-weight:550;
  overflow-wrap:anywhere;
}
.love-note-date{color:#AC9A8E;font-size:9px}
.intent-editor-head{display:flex;align-items:center;gap:10px;padding:2px 2px 13px}
.intent-editor-emoji{
  width:38px;
  height:38px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:var(--surface-alt);
  font-size:21px;
  line-height:1;
}
.intent-editor-emoji[hidden]{display:none}
.intent-editor-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
.intent-editor-kind{color:var(--faint);font-size:8px;letter-spacing:.06em}
.intent-editor-copy strong{color:var(--ink);font-size:14px;font-weight:600;overflow-wrap:anywhere}
.intent-editor-textarea{min-height:82px;resize:vertical}
.info-list{margin:0;padding:0 0 0 18px;color:#5C5146;font-size:11.5px;line-height:1.9}
.info-list li{padding-left:2px}
.info-list li::marker{color:#B4A597}
.sheet-note{margin:12px 0 0;padding:9px 10px;border-radius:8px;background:var(--surface-alt);color:var(--muted);font-size:9.5px;line-height:1.5}
.moment-compose{display:flex;flex-direction:column;gap:9px;padding:2px 2px 4px}
.compose-textarea{
  width:100%;
  min-height:96px;
  resize:vertical;
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
  background:#fff;
  font-size:14px;
  line-height:1.6;
}
.compose-textarea:focus{border-color:#D7B7A5;box-shadow:0 0 0 2px rgba(212,104,71,.06)}
.compose-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.photo-btn{
  height:30px;
  padding:0 10px;
  border-radius:7px;
  border:1px solid var(--line);
  background:var(--surface);
  color:#665B50;
  font-size:10px;
}
.photo-btn:hover{background:var(--surface-alt)}
.compose-hint{color:var(--faint);font-size:8.5px}
.decision-compose{display:flex;flex-direction:column;gap:9px;padding:2px 2px 4px}
.decision-option-list{display:flex;flex-direction:column;gap:6px}
.decision-option-row{display:flex;align-items:center;gap:6px}
.decision-option-input{
  flex:1;
  min-width:0;
  height:36px;
  padding:0 9px;
  border:1px solid var(--line);
  border-radius:8px;
  outline:none;
  background:#fff;
  color:var(--ink);
  font-size:12px;
}
.decision-option-input:focus{border-color:#D7B7A5}
.decision-option-remove{
  width:24px;
  height:24px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--surface-alt);
  color:#9A8D80;
  font-size:14px;
  line-height:1;
}
.decision-option-remove:hover{background:#EFE7DD;color:#6F6358}
.decision-option-remove[hidden]{display:none}
.decision-add-option{
  align-self:flex-start;
  height:26px;
  padding:0 8px;
  border:1px dashed #D5C4B4;
  border-radius:6px;
  background:transparent;
  color:#9D8F81;
  font-size:9.5px;
}
.decision-add-option:hover{background:#fff;color:#7E7062}
.decision-add-option:disabled{opacity:.4;cursor:default;pointer-events:none}
.decision-answer-count-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.decision-answer-count-row .field-label{margin:0}
.decision-count-group{display:flex;gap:4px}
.decision-count-btn{
  width:28px;
  height:27px;
  display:grid;
  place-items:center;
  border-radius:6px;
  background:var(--surface-alt);
  color:#7D7064;
  font-size:10px;
}
.decision-count-btn.active{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.decision-count-btn:disabled{opacity:.35;pointer-events:none}
.decision-compose-hint{margin:0;color:var(--faint);font-size:8.5px;line-height:1.5}
.moment-draft-image{position:relative;width:110px;height:84px;border-radius:8px;overflow:hidden;background:var(--surface-alt);border:1px solid var(--line)}
.moment-draft-image img{width:100%;height:100%;object-fit:cover}
.remove-image{
  position:absolute;
  top:3px;
  right:3px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(40,34,28,.65);
  color:#fff;
  font-size:13px;
  line-height:1;
}

/* Toast */
.toast{
  position:absolute;
  z-index:200;
  top:calc(70px + env(safe-area-inset-top,0px));
  left:50%;
  max-width:calc(100% - 36px);
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 12px;
  border-radius:9px;
  background:rgba(47,41,35,.94);
  color:#fff;
  font-size:10.5px;
  line-height:1.4;
  box-shadow:0 8px 22px rgba(38,28,20,.18);
  opacity:0;
  transform:translate(-50%,-6px);
  pointer-events:none;
  transition:opacity .16s,transform .16s;
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;color:#FFC2A2;font-size:10.5px;font-weight:600}

/* ——— Mobile ——— */
@media (max-width:560px){
  body{background:var(--bg);display:block;min-height:100dvh}
  .app{max-height:none;height:100dvh;border:0;border-radius:0;box-shadow:none}
}
@media (max-width:380px){
  .topbar{padding-left:9px;padding-right:9px}
  .chat{padding-left:11px;padding-right:11px}
  .composer{padding-left:9px;padding-right:9px}
  .tool-note{display:none}
  .contact-sub{max-width:125px}
  .msg.me{padding-left:36px}
  .msg.them{padding-right:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<div class="app" id="app">
  <section class="view chat-view" id="chatView">
    <header class="topbar">
      <button class="contact-btn" id="contactBtn" type="button">

    <main class="chat" id="chat" role="log" aria-live="polite" aria-label="聊天记录"></main>

    <section class="composer">
      <div class="tools">
        <button class="tool-btn" id="cardsChip" type="button">

            <rect x="3.5" y="4.5" width="12" height="15" rx="2.5"/>

        <button class="tool-btn" id="stickersChip" type="button">

            <path d="M20.3 12a8.3 8.3 0 1 1-8.3-8.3"/>
            <path d="M8.7 9.8h.01M15.2 9.8h.01M8.4 14c1 1.3 2.2 2 3.6 2s2.6-.7 3.6-2"/>
            <path d="M18.2 3.5v4M16.2 5.5h4"/>
          </svg>
          表情
          <span class="tool-count js-sticker-count">0</span>
        </button>
        <button class="tool-btn" id="decisionBtn" type="button" aria-label="出一道选择题">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/>

        </button>
        <button class="tool-btn" id="heartBtn" type="button" aria-label="给对方比心">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>

      <form class="input-row" id="messageForm">

  <section class="view moments-view" id="momentsView" hidden>
    <header class="moments-topbar">
      <button class="back-btn" id="momentsBack" type="button" aria-label="返回聊天">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <h1 class="moments-title">朋友圈</h1>
      <button class="publish-btn" id="composeMomentBtn" type="button">发布</button>

    <div class="moments-scroll" id="momentsScroll">

  <section class="view mail-view" id="mailView" hidden>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <div class="letter-list" id="letterList"></div>

  <div class="overlay" id="collectionLayer" hidden>
    <div class="scrim" data-close-collection></div>
    <section class="sheet collection-sheet" id="collectionSheet" role="dialog" aria-modal="true" aria-labelledby="collectionTitle" tabindex="-1">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <div>
          <h2 id="collectionTitle">我的字卡</h2>
          <p class="sheet-sub" id="collectionSub">对方会挑单张或拼 1–3 张字卡回复你。</p>
        </div>
        <button class="close-btn" id="collectionClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="collection-bar">
        <div class="tabs" role="tablist" aria-label="字卡和表情">

          <button class="inline-submit" id="addCardSubmit" type="button" disabled>添加</button>
        </div>
        <div class="intent-field">
          <label class="intent-label" for="cardIntentInput">字卡意图</label>
          <input class="intent-input" id="cardIntentInput" type="text" maxlength="80" placeholder="对方发这张卡时，想表达什么？（选填）" autocomplete="off">

          <button class="group-add" id="newGroupBtn" type="button">+ 新分组</button>

        <div class="new-group-form" id="newGroupForm" hidden>
          <input class="group-input" id="newGroupInput" type="text" maxlength="8" placeholder="输入分组名称" autocomplete="off" aria-label="新分组名称">

          <button class="group-cancel" id="cancelGroupBtn" type="button">取消</button>
        </div>
        <p class="form-hint">选或输入 emoji，最多 12 个字 · 可新建分组</p>
      </div>
      <div class="collection-body" id="collectionBody">
        <div class="card-grid" id="cardLibrary" aria-label="我的字卡"></div>
        <div class="sticker-grid" id="stickerLibrary" aria-label="我的表情" hidden></div>
      </div>

  <div class="overlay" id="sheetLayer" hidden>
    <div class="scrim" data-close-sheet></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="grabber" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle"></h2>
        <button class="close-btn" id="sheetClose" type="button" aria-label="关闭">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-actions" id="sheetActions"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<input id="stickerInput" type="file" accept="image/*" multiple hidden>
<input id="avatarInput" type="file" accept="image/*" hidden>
<input id="momentImageInput" type="file" accept="image/*" hidden>

<script>
(() => {
  'use strict';

  /* ————————————————————————————————
     Constants
  ———————————————————————————————— */
  const KEYS = {
    messages: 'zika.v3.messages',
    cards: 'zika.v3.cards',
    cardGroups: 'zika.v3.cardGroups',
    customEmojis: 'zika.v3.emojis',
    replySettings: 'zika.v3.replySettings',
    stickers: 'zika.v3.stickers',
    contact: 'zika.v3.contact',
    anniversary: 'zika.v3.anniversary',
    promises: 'zika.v3.promises',
    dailyLove: 'zika.v3.dailyLove',
    moments: 'zika.v4.moments',
    momentSignature: 'zika.v4.moments.signature',
    letters: 'zika.v5.mail.letters',
    nextLetterAt: 'zika.v5.mail.next'
  };
  const MAX_MESSAGES = 80;
  const MAX_CARDS = 60;
  const MAX_CUSTOM_GROUPS = 12;
  const MAX_CUSTOM_EMOJIS = 24;
  const MAX_STICKERS = 24;
  const MAX_MOMENTS = 50;
  const MAX_LETTERS = 80;
  const MAX_PROMISES = 30;
  const MAIL_MIN_DELAY = 60 * 60 * 1000;
  const MAIL_MAX_DELAY = 24 * 60 * 60 * 1000;
  const MAX_FILE_BYTES = 12 * 1024 * 1024;
  const IMAGE_TARGET_BYTES = 20 * 1024;
  const IMAGE_FILE_PATTERN = /\.(png|jpe?g|webp|gif|heic|heif|bmp|avif)$/i;

  const EMOJIS = ['🌿', '💛', '🤗', '☕', '🌙', '🍚', '💧', '✨', '🌷', '🎧', '🧸', '🍰', '☀️', '🫧', '🐾', '📖'];
  const PROMISE_SUGGESTIONS = ['一起看日出', '一起做顿饭', '拍一张合照', '去一次海边'];
  const LOVE_LINES = [
    '今天也比昨天更喜欢你一点。',
    '看到好看的天，第一反应是想拍给你。',
    '你不用特别做什么，在我这里就已经很重要了。',
    '想和你把普通的日子过得很长很长。',
    '今天的风很轻，适合想你。',
    '有你在，碎碎念也有人接住。',
    '希望我们一直是彼此的例外和偏爱。',
    '你是我生活里最柔软的那一部分。',
    '想和你一起，把很多个明天都过成今天。',
    '如果想念有声音，你现在应该很吵。',
    '今天也想把最好的耐心留给你。',
    '喜欢你这件事，好像没有尽头。'
  ];
  const EMOJI_TEST = /(?:\p{Extended_Pictographic}|\p{Regional_Indicator}|\u20E3)/u;
  let graphemeSegmenter = null;
  try {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      graphemeSegmenter = new Intl.Segmenter('zh', { granularity: 'grapheme' });
    }
  } catch (_) {}

  function firstGrapheme(value) {
    const text = typeof value === 'string' ? value.trim() : '';
    if (!text) return '';
    if (graphemeSegmenter) {
      const iterator = graphemeSegmenter.segment(text)[Symbol.iterator]();
      const first = iterator.next();
      return first.done ? '' : first.value.segment;
    }
    return Array.from(text)[0] || '';
  }

  function normalizeEmoji(value, fallback = '🌿') {
    const grapheme = firstGrapheme(value);
    if (!grapheme || !EMOJI_TEST.test(grapheme)) return fallback;
    return grapheme;

  function startOfDay(timestamp) {

  function dayLabel(timestamp) {
    const diff = Math.round((startOfDay(Date.now()) - startOfDay(timestamp)) / 86400000);
    if (diff === 0) return '今天';

    const date = new Date(timestamp);
    return `${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function relativeTime(timestamp) {
    const diff = Date.now() - timestamp;
    if (diff < 60 * 1000) return '刚刚';
    if (diff < 60 * 60 * 1000) return `${Math.max(1, Math.floor(diff / 60000))}分钟前`;
    if (diff < 24 * 60 * 60 * 1000) return `${Math.floor(diff / 3600000)}小时前`;
    if (diff < 48 * 60 * 60 * 1000) return '昨天';
    const date = new Date(timestamp);
    return `${date.getMonth() + 1}月${date.getDate()}日`;

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error('read failed'));

  let webpEncodeSupport = null;

  function canEncodeWebp() {
    if (webpEncodeSupport !== null) return webpEncodeSupport;
    const canvas = document.createElement('canvas');
    canvas.width = 1;
    canvas.height = 1;
    webpEncodeSupport = canvas.toDataURL('image/webp').startsWith('data:image/webp');
    return webpEncodeSupport;
  }

  function fitImageToBudget(baseCanvas, alpha = false) {
    const types = alpha
      ? (canEncodeWebp() ? ['image/webp', 'image/png'] : ['image/png'])
      : (canEncodeWebp() ? ['image/webp', 'image/jpeg'] : ['image/jpeg']);
    const minSide = alpha ? 64 : 120;
    let current = baseCanvas;
    for (let round = 0; round < 18; round += 1) {
      for (const type of types) {
        const qualities = type === 'image/png' ? [undefined] : [0.82, 0.72, 0.62, 0.52, 0.42, 0.32];
        for (const quality of qualities) {
          const src = quality === undefined ? current.toDataURL(type) : current.toDataURL(type, quality);
          if (!src.startsWith(`data:${type}`)) continue;
          if (src.length <= IMAGE_TARGET_BYTES) return src;
        }
      }
      if (Math.max(current.width, current.height) <= minSide) break;
      const next = document.createElement('canvas');
      next.width = Math.max(1, Math.round(current.width * 0.78));
      next.height = Math.max(1, Math.round(current.height * 0.78));
      const context = next.getContext('2d');
      if (!context) break;
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(current, 0, 0, next.width, next.height);
      current = next;
    }
    const type = types[0];
    let src = type === 'image/png'
      ? current.toDataURL(type)
      : current.toDataURL(type, 0.3);
    if (!src.startsWith(`data:${type}`)) src = current.toDataURL('image/png');
    return src;
  }

  function compressSticker(img) {
    const SIZE = 320;
    const PAD = 14;
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas unavailable');
    const width = img.naturalWidth || img.width;
    const height = img.naturalHeight || img.height;
    if (!width || !height) throw new Error('empty image');
    const scale = Math.min((SIZE - PAD * 2) / width, (SIZE - PAD * 2) / height, 1);
    const drawW = width * scale;
    const drawH = height * scale;
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, (SIZE - drawW) / 2, (SIZE - drawH) / 2, drawW, drawH);
    return fitImageToBudget(canvas, true);
  }

    const width = img.naturalWidth || img.width;
    const height = img.naturalHeight || img.height;
    if (!width || !height) throw new Error('empty image');
    const scale = Math.max(SIZE / width, SIZE / height);
    const drawW = width * scale;
    const drawH = height * scale;
    ctx.fillStyle = '#F2EDE5';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, (SIZE - drawW) / 2, (SIZE - drawH) / 2, drawW, drawH);
    return fitImageToBudget(canvas, false);
  }

  function compressMomentPhoto(img) {
    const MAX = 900;
    const width = img.naturalWidth || img.width;
    const height = img.naturalHeight || img.height;
    if (!width || !height) throw new Error('empty image');
    const scale = Math.min(1, MAX / width, MAX / height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(width * scale));
    canvas.height = Math.max(1, Math.round(height * scale));
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('canvas unavailable');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return fitImageToBudget(canvas, false);
  }

  function loadContact() {
    const raw = safeGet(KEYS.contact);

  function parseDateOnly(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
    const [year, month, day] = value.split('-').map(Number);
    const date = new Date(year, month - 1, day);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function daysTogether() {
    const start = parseDateOnly(state.anniversary);
    if (!start) return 0;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const days = Math.floor((today - start) / 86400000) + 1;
    return days > 0 ? days : 0;
  }

  function loadAnniversary() {
    const raw = safeGet(KEYS.anniversary);
    if (raw === null) return;
    if (parseDateOnly(raw)) state.anniversary = raw;
  }

  function localDayKey() {

    return `${now.getFullYear()}-${padDatePart(now.getMonth() + 1)}-${padDatePart(now.getDate())}`;

    if (state.dailyLove.date !== today || !Number.isFinite(state.dailyLove.index)) {

        index: Math.floor(Math.random() * LOVE_LINES.length)
      };

  function loadCustomGroups() {
    const raw = safeGet(KEYS.cardGroups);
    if (raw === null) return;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('bad groups');
      const usedIds = new Set(CARD_GROUPS.map(group => group.id));
      const usedNames = new Set(CARD_GROUPS.map(group => group.name));
      const groups = [];
      for (const item of parsed) {
        if (!item || typeof item.id !== 'string' || typeof item.name !== 'string') continue;
        const id = item.id.trim();
        const name = item.name.trim().slice(0, 8);
        if (!id || !name || usedIds.has(id) || usedNames.has(name)) continue;
        usedIds.add(id);
        usedNames.add(name);
        groups.push({ id, name });
        if (groups.length >= MAX_CUSTOM_GROUPS) break;
      }
      state.customGroups = groups;
    } catch (_) {
      state.customGroups = [];
    }
  }

  function persistCustomGroups() {
    return safeSet(KEYS.cardGroups, JSON.stringify(state.customGroups));
  }

  function loadCustomEmojis() {
    const raw = safeGet(KEYS.customEmojis);
    if (raw === null) return;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('bad emojis');
      const seen = new Set(EMOJIS);
      const emojis = [];
      for (const item of parsed) {
        const emoji = normalizeEmoji(item, '');
        if (!emoji || seen.has(emoji)) continue;
        seen.add(emoji);
        emojis.push(emoji);
        if (emojis.length >= MAX_CUSTOM_EMOJIS) break;
      }
      state.customEmojis = emojis;
    } catch (_) {
      state.customEmojis = [];
    }
  }

  }

  function loadReplySettings() {
    const raw = safeGet(KEYS.replySettings);
    if (raw === null) return;
    try {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return;
      const rangeKeys = ['delayMin', 'delayMax', 'messageMin', 'messageMax', 'cardMin', 'cardMax'];
      const hasRanges = rangeKeys.some(key => Number.isFinite(Number(parsed[key])));
      if (!hasRanges) {
        if (typeof parsed.merge === 'boolean') state.replySettings.merge = parsed.merge;
        if (typeof parsed.theyAddCards === 'boolean') state.replySettings.theyAddCards = parsed.theyAddCards;
        return;
      }
      const clampDelay = value => {
        const number = Number(value);
        if (!Number.isFinite(number)) return null;
        return Math.min(8, Math.max(0.5, Math.round(number * 2) / 2));
      };
      const clampCount = value => {
        const number = Number(value);
        if (!Number.isFinite(number)) return null;
        return Math.min(3, Math.max(1, Math.round(number)));
      };
      const normalizePair = (a, b, fallbackA, fallbackB, clamp) => {
        const first = clamp(a) ?? fallbackA;
        const second = clamp(b) ?? fallbackB;
        return [Math.min(first, second), Math.max(first, second)];
      };
      const [delayMin, delayMax] = normalizePair(parsed.delayMin, parsed.delayMax, 1, 3, clampDelay);
      const [messageMin, messageMax] = normalizePair(parsed.messageMin, parsed.messageMax, 1, 2, clampCount);
      const [cardMin, cardMax] = normalizePair(parsed.cardMin, parsed.cardMax, 1, 3, clampCount);
      state.replySettings = {
        delayMin,
        delayMax,
        messageMin,
        messageMax,
        cardMin,
        cardMax,
        merge: typeof parsed.merge === 'boolean' ? parsed.merge : true,
        theyAddCards: typeof parsed.theyAddCards === 'boolean' ? parsed.theyAddCards : true
      };
    } catch (_) {}
  }

  function persistReplySettings() {
    return safeSet(KEYS.replySettings, JSON.stringify(state.replySettings));
  }

  function loadCards() {

        typeof card.emoji === 'string'
      ).slice(0, MAX_CARDS).map(card => {

        return {
          id: card.id,

          group: normalizeCardGroup(card.group, label),
          intent: normalizeCardIntent(card.intent, label),
          createdAt: Number.isFinite(card.createdAt) ? card.createdAt : 0
        };
      });
    } catch (_) {
      state.cards = makeStarterCards();
      safeSet(KEYS.cards, JSON.stringify(state.cards));

  function loadMessages() {
    const raw = safeGet(KEYS.messages);
    if (raw === null) return false;
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('bad messages');
      state.messages = parsed.map(normalizeMessage).filter(Boolean).slice(-MAX_MESSAGES);
      return state.messages.length > 0;
    } catch (_) {
      return false;
    }
  }

  function normalizeMessage(message) {
    if (!message || typeof message !== 'object' || !Number.isFinite(message.at)) return null;
    if (message.type === 'text') {
      if (message.from !== 'me') return null;
      const text = typeof message.text === 'string' ? message.text.trim() : '';
      if (!text) return null;
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'me',
        type: 'text',
        text: text.slice(0, 200),
        at: message.at
      };
    }
    if (message.type === 'decision') {
      if (message.from !== 'me') return null;
      const question = typeof message.question === 'string' ? message.question.trim() : '';
      const options = Array.isArray(message.options)
        ? message.options.map(option => {
          const text = typeof option === 'string'
            ? option
            : option && typeof option.text === 'string'
              ? option.text
              : '';
          return text.trim().slice(0, 20);
        }).filter(Boolean).slice(0, 4)
        : [];
      if (!question || options.length < 2) return null;
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'me',
        type: 'decision',
        question: question.slice(0, 60),
        options: options.map(text => ({ id: 'option-' + uid(), text })),
        answerCount: Number.isFinite(message.answerCount)
          ? Math.min(options.length, Math.max(1, Math.round(message.answerCount)))
          : 1,
        at: message.at
      };
    }
    if (message.type === 'heart') {
      if (message.from !== 'me') return null;
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'me',
        type: 'heart',
        at: message.at
      };
    }
    if (message.from !== 'them') return null;
    if (message.type === 'decisionAnswer') {
      const rawAnswers = Array.isArray(message.answerTexts)
        ? message.answerTexts
        : typeof message.answerText === 'string' ? [message.answerText] : [];
      const answerTexts = rawAnswers
        .filter(text => typeof text === 'string' && text.trim())
        .map(text => text.trim().slice(0, 20))
        .slice(0, 4);
      if (!answerTexts.length) return null;
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'them',
        type: 'decisionAnswer',
        questionId: typeof message.questionId === 'string' ? message.questionId : '',
        question: typeof message.question === 'string' ? message.question.trim().slice(0, 60) : '',
        answerId: typeof message.answerId === 'string' ? message.answerId : '',
        answerTexts,
        answerText: answerTexts.join('，'),
        at: message.at
      };
    }
    if (message.type === 'card') {
      const label = typeof message.cardLabel === 'string' ? message.cardLabel.trim() : '';
      if (!label) return null;
      const combo = Boolean(message.combo);
      const cardCount = combo && Number.isFinite(message.cardCount)
        ? Math.min(3, Math.max(1, Math.round(message.cardCount)))
        : 1;
      const noEmoji = Boolean(message.noEmoji) || !message.cardEmoji;
      const cardIntent = typeof message.cardIntent === 'string' ? message.cardIntent.trim().slice(0, 80) : '';
      const cardIntents = Array.isArray(message.cardIntents)
        ? message.cardIntents
          .filter(item => item && typeof item.intent === 'string' && item.intent.trim())
          .slice(0, 3)
          .map(item => ({
            label: typeof item.label === 'string' ? item.label.trim().slice(0, 80) : '',
            intent: item.intent.trim().slice(0, 80)
          }))
        : [];
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'them',
        type: 'card',
        cardId: typeof message.cardId === 'string' ? message.cardId : '',
        cardLabel: label.slice(0, combo ? 260 : 80),
        cardEmoji: noEmoji ? '' : normalizeEmoji(message.cardEmoji, '🃏'),
        noEmoji,
        combo,
        cardCount,
        cardIntent,
        cardIntents,
        at: message.at
      };
    }
    if (message.type === 'sticker') {
      if (typeof message.src !== 'string' || !message.src.startsWith('data:image/')) return null;
      return {
        id: typeof message.id === 'string' ? message.id : uid(),
        from: 'them',
        type: 'sticker',
        stickerId: typeof message.stickerId === 'string' ? message.stickerId : '',
        stickerName: typeof message.stickerName === 'string' ? message.stickerName : '表情',
        src: message.src,
        at: message.at
      };
    }
    return null;
  }

  function persistMessages() {
    return safeSet(KEYS.messages, JSON.stringify(state.messages.slice(-MAX_MESSAGES)));
  }

  function loadMoments() {
    const raw = safeGet(KEYS.moments);
    if (raw === null) {
      state.moments = seedMoments();
      persistMoments();
      return;
    }
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('bad moments');
      state.moments = parsed.map(normalizeMoment).filter(Boolean).slice(0, MAX_MOMENTS);
    } catch (_) {
      state.moments = seedMoments();
      persistMoments();
    }
  }

  function normalizeMoment(moment) {
    if (!moment || typeof moment !== 'object' || !Number.isFinite(moment.at)) return null;
    if (moment.author !== 'contact' && moment.author !== 'me') return null;
    const text = typeof moment.text === 'string' ? moment.text.trim().slice(0, 300) : '';
    const hasImage = typeof moment.image === 'string' && moment.image.startsWith('data:image/');
    if (!text && !hasImage) return null;
    const comments = Array.isArray(moment.comments)
      ? moment.comments.filter(comment =>
          comment &&
          typeof comment.text === 'string' &&
          comment.text.trim() &&
          Number.isFinite(comment.at) &&
          (comment.author === 'me' || comment.author === 'contact')
        ).slice(-30).map(comment => ({
          id: typeof comment.id === 'string' ? comment.id : uid(),
          author: comment.author,
          text: comment.text.trim().slice(0, 160),
          at: comment.at
        }))
      : [];
    return {
      id: typeof moment.id === 'string' ? moment.id : uid(),
      author: moment.author,
      text,
      image: hasImage ? moment.image : '',
      imageKind: hasImage && moment.imageKind === 'sticker' ? 'sticker' : 'photo',
      at: moment.at,
      likes: Number.isFinite(moment.likes) ? Math.max(0, Math.floor(moment.likes)) : 0,
      liked: Boolean(moment.liked),
      dislikes: Number.isFinite(moment.dislikes) ? Math.max(0, Math.floor(moment.dislikes)) : 0,
      disliked: Boolean(moment.disliked),
      comments
    };
  }

  function persistMoments() {
    return safeSet(KEYS.moments, JSON.stringify(state.moments.slice(0, MAX_MOMENTS)));
  }

  function pickMomentCards() {
    if (!state.cards.length) return [];
    const count = Math.min(state.cards.length, Math.random() < 0.55 ? 2 : 3);
    const pool = [...state.cards];
    const picked = [];
    while (picked.length < count && pool.length) {
      const index = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(index, 1)[0]);
    }
    return picked;
  }

  function pickMomentSticker() {
    if (!state.stickers.length) return null;
    const weighted = [];
    for (const sticker of state.stickers) {
      const weight = sticker.kind === 'custom' ? 3 : 1;
      for (let i = 0; i < weight; i += 1) weighted.push(sticker);
    }
    return randomOf(weighted);
  }

  function makeContactMoment(at, withSticker) {
    const picked = pickMomentCards();
    if (!picked.length) return null;
    const useSticker = withSticker || Math.random() < 0.55;
    const sticker = useSticker ? pickMomentSticker() : null;
    return {
      id: uid(),
      author: 'contact',
      text: picked.map(card => card.label).join('，') + '。',
      image: sticker ? sticker.src : '',
      imageKind: sticker ? 'sticker' : 'photo',
      at,
      likes: 3 + Math.floor(Math.random() * 10),
      liked: false,
      dislikes: Math.floor(Math.random() * 3),
      disliked: false,
      comments: []
    };
  }

  function seedMoments() {
    const now = Date.now();
    const times = [
      now - 2 * 60 * 60 * 1000,
      now - 27 * 60 * 60 * 1000,
      now - 3 * 24 * 60 * 60 * 1000
    ];
    const count = state.cards.length >= 4 ? 3 : state.cards.length >= 2 ? 2 : state.cards.length;
    const moments = [];
    for (let i = 0; i < count; i += 1) {
      const moment = makeContactMoment(times[i], i === 0);
      if (moment) moments.push(moment);
    }
    return moments;
  }

  function assetSignature() {
    return JSON.stringify({
      cards: state.cards.map(card => [card.id, card.label, card.emoji]),
      stickers: state.stickers.map(sticker => sticker.id)
    });
  }

  function refreshContactMomentsIfNeeded() {
    const signature = assetSignature();
    if (!state.momentSignature) {
      state.momentSignature = signature;
      safeSet(KEYS.momentSignature, signature);
      return;
    }
    if (signature === state.momentSignature) return;
    const userMoments = state.moments.filter(moment => moment.author === 'me');
    const contactMoments = seedMoments();
    state.moments = [...contactMoments, ...userMoments].sort((a, b) => b.at - a.at);
    state.commentingMomentId = null;
    state.momentSignature = signature;
    safeSet(KEYS.momentSignature, signature);
    persistMoments();
  }

  function seedMessages() {
    const now = Date.now();
    const messages = [];
    const hello = state.cards.find(card => card.label === '你好') || state.cards[0];
    if (hello) {
      messages.push({
        id: uid(),
        from: 'them',
        type: 'card',
        cardId: hello.id,
        cardLabel: hello.label,
        cardEmoji: hello.emoji,
        cardIntent: hello.intent || FALLBACK_CARD_INTENT,
        at: now - 110000
      });
    }
    const happy = state.stickers.find(sticker => sticker.id === 'builtin-happy') || state.stickers[0];
    if (happy) {
      messages.push({
        id: uid(),
        from: 'them',
        type: 'sticker',
        stickerId: happy.id,
        stickerName: happy.name,
        src: happy.src,
        at: now - 62000
      });
    }
    return messages;
  }

  /* ————————————————————————————————
     Mailbox
  ———————————————————————————————— */
  function pickRandomCards(count) {
    const pool = [...state.cards];
    const picked = [];
    const take = Math.min(count, pool.length);
    while (picked.length < take && pool.length) {
      const index = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(index, 1)[0]);
    }
    return picked;
  }

  function normalizeLetter(letter) {
    if (!letter || typeof letter !== 'object' || !Number.isFinite(letter.at)) return null;
    if (letter.from === 'me') {
      const text = typeof letter.text === 'string' ? letter.text.trim().slice(0, 500) : '';
      if (!text) return null;
      return {
        id: typeof letter.id === 'string' ? letter.id : uid(),
        from: 'me',
        text,
        cards: [],
        at: letter.at,
        read: true
      };
    }
    if (letter.from !== 'contact') return null;
    const cards = Array.isArray(letter.cards)
      ? letter.cards.filter(card => card && typeof card.label === 'string' && card.label.trim())
        .slice(0, 10)
        .map(card => ({
          label: card.label.trim().slice(0, 12),
          emoji: normalizeEmoji(card.emoji, '🃏')
        }))
      : [];
    if (!cards.length) return null;
    return {
      id: typeof letter.id === 'string' ? letter.id : uid(),
      from: 'contact',
      text: '',
      cards,
      at: letter.at,
      read: Boolean(letter.read)
    };
  }

  function loadLetters() {
    const raw = safeGet(KEYS.letters);
    if (raw === null) {
      const first = makeIncomingLetter(Date.now() - 2 * 60 * 1000, false);
      state.letters = first ? [first] : [];
      persistLetters();
      return;
    }
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('bad letters');
      state.letters = parsed.map(normalizeLetter).filter(Boolean).slice(0, MAX_LETTERS);
    } catch (_) {
      state.letters = [];
    }
  }

  function persistLetters() {
    return safeSet(KEYS.letters, JSON.stringify(state.letters.slice(0, MAX_LETTERS)));
  }

  function makeIncomingLetter(at, read) {
    if (!state.cards.length) return null;
    const maxCount = Math.min(10, state.cards.length);
    const count = 1 + Math.floor(Math.random() * maxCount);
    const picked = pickRandomCards(count);
    if (!picked.length) return null;
    return {
      id: uid(),
      from: 'contact',
      text: '',
      cards: picked.map(card => ({ label: card.label, emoji: card.emoji })),
      at,
      read: Boolean(read)
    };
  }

  function updateMailBadge() {
    if (!els.mailBadge) return;
    const unread = state.letters.filter(letter => letter.from === 'contact' && !letter.read).length;
    els.mailBadge.hidden = unread === 0;
    els.mailBadge.textContent = unread > 9 ? '9+' : String(unread);
    els.mailBtn.setAttribute('aria-label', unread ? `信箱，${unread} 封未读` : '信箱');
  }

  function updateNextMailLabel() {
    if (!els.nextMailText) return;
    if (!state.nextLetterAt) {
      els.nextMailText.textContent = '下一封信还在路上';
      return;
    }
    const remaining = state.nextLetterAt - Date.now();
    if (remaining <= 0) {
      els.nextMailText.textContent = '下一封信随时会送达';
      return;
    }
    if (remaining < 60 * 60 * 1000) {
      els.nextMailText.textContent = `下一封信预计约 ${Math.max(1, Math.ceil(remaining / 60000))} 分钟后送达`;
    } else {
      els.nextMailText.textContent = `下一封信预计约 ${Math.round(remaining / 3600000)} 小时后送达`;
    }
  }

  function setMailTimer(delay) {
    if (mailTimer) clearTimeout(mailTimer);
    mailTimer = setTimeout(() => {
      mailTimer = null;
      checkMailDelivery();
    }, Math.max(1000, Math.floor(delay)));
  }

  function scheduleNextLetter(delay) {
    const wait = typeof delay === 'number'
      ? delay
      : MAIL_MIN_DELAY + Math.random() * (MAIL_MAX_DELAY - MAIL_MIN_DELAY);
    state.nextLetterAt = Date.now() + Math.round(wait);
    safeSet(KEYS.nextLetterAt, String(state.nextLetterAt));
    setMailTimer(wait);
    updateNextMailLabel();
  }

  function deliverIncomingLetter() {
    const letter = makeIncomingLetter(Date.now(), state.view === 'mail');
    if (!letter) return false;
    state.letters.unshift(letter);
    state.letters = state.letters.slice(0, MAX_LETTERS);
    persistLetters();
    updateMailBadge();
    if (state.view === 'mail') {
      markMailRead();
      renderMailbox();
      els.mailScroll.scrollTop = 0;
    } else {
      showToast('收到一封新信', '查看', openMailbox);
    }
    return true;
  }

  function checkMailDelivery() {
    if (!state.nextLetterAt) {
      scheduleNextLetter();
      return;
    }
    const remaining = state.nextLetterAt - Date.now();
    if (remaining > 0) {
      setMailTimer(remaining);
      updateNextMailLabel();
      return;
    }
    deliverIncomingLetter();
    scheduleNextLetter();
  }

  function markMailRead() {
    let changed = false;
    state.letters.forEach(letter => {
      if (letter.from === 'contact' && !letter.read) {
        letter.read = true;
        changed = true;
      }
    });
    if (changed) persistLetters();
    updateMailBadge();
  }

  function initMail() {
    loadLetters();
    const stored = Number(safeGet(KEYS.nextLetterAt));
    state.nextLetterAt = Number.isFinite(stored) && stored > 0 ? stored : 0;
    updateMailBadge();
    if (!state.nextLetterAt) {
      scheduleNextLetter();
    } else if (Date.now() >= state.nextLetterAt) {
      checkMailDelivery();
    } else {
      setMailTimer(state.nextLetterAt - Date.now());
      updateNextMailLabel();
    }
  }

  function renderMailbox() {
    if (!els.letterList) return;
    els.letterList.innerHTML = '';
    const letters = [...state.letters].sort((a, b) => b.at - a.at);
    if (!letters.length) {
      const empty = document.createElement('div');
      empty.className = 'mail-empty';
      const strong = document.createElement('strong');
      strong.textContent = '信箱空空的';
      const copy = document.createElement('span');
      copy.textContent = '等对方的信，或者先写一封寄出去。';
      empty.append(strong, copy);
      els.letterList.appendChild(empty);
      updateNextMailLabel();
      return;
    }

    for (const letter of letters) {
      const item = document.createElement('article');
      item.className = 'letter' + (letter.from === 'me' ? ' from-me' : '');
      const head = document.createElement('div');
      head.className = 'letter-head';
      if (letter.from === 'me') {
        const avatar = document.createElement('div');
        avatar.className = 'me-avatar';
        avatar.textContent = '我';
        head.appendChild(avatar);
      } else {
        const avatar = new Image();
        avatar.className = 'letter-avatar';
        avatar.src = state.contact.avatar;
        avatar.alt = contactName();
        head.appendChild(avatar);
      }
      const copy = document.createElement('div');
      copy.className = 'letter-head-copy';
      const author = document.createElement('span');
      author.className = 'letter-author';
      author.textContent = letter.from === 'me' ? '我' : contactName();
      const meta = document.createElement('span');
      meta.className = 'letter-meta';
      meta.textContent = letter.from === 'me'
        ? `寄出 · ${relativeTime(letter.at)}`
        : `来信 · ${letter.cards.length} 张字卡 · ${relativeTime(letter.at)}`;
      copy.append(author, meta);
      head.appendChild(copy);

      const paper = document.createElement('div');
      paper.className = 'letter-paper';
      if (letter.from === 'me') {
        const text = document.createElement('p');
        text.className = 'letter-text';
        text.textContent = letter.text;
        paper.appendChild(text);
      } else {
        const cards = document.createElement('div');
        cards.className = 'letter-cards';
        letter.cards.forEach(card => {
          const chip = document.createElement('span');
          chip.className = 'letter-card';
          const emoji = document.createElement('span');
          emoji.className = 'letter-card-emoji';
          emoji.textContent = card.emoji;
          emoji.setAttribute('aria-hidden', 'true');
          const label = document.createElement('span');
          label.textContent = card.label;
          chip.append(emoji, label);
          cards.appendChild(chip);
        });
        paper.appendChild(cards);
      }
      item.append(head, paper);
      els.letterList.appendChild(item);
    }
    updateNextMailLabel();
  }

  function openMailbox() {
    closeMenu();
    state.view = 'mail';
    els.chatView.hidden = true;
    els.momentsView.hidden = true;
    els.mailView.hidden = false;
    checkMailDelivery();
    markMailRead();
    renderMailbox();
    els.mailScroll.scrollTop = 0;
    updateNextMailLabel();
    updateDocumentTitle();
  }

      <textarea class="compose-textarea" id="letterText" maxlength="500" placeholder="写点什么寄给对方…"></textarea>
      <p class="field-hint">对方会在 1–24 小时内回信 · 最多 500 字</p>
    `;

  function decisionOptionRow(label) {

    row.className = 'decision-option-row';

    letter.className = 'decision-letter';
    letter.textContent = label;

  function renderDecisionCompose() {
    els.sheetTitle.textContent = '出一道选择题';
    els.sheetBody.innerHTML = `
      <div class="decision-compose">
        <div>
          <label class="field-label" for="decisionQuestion">问题</label>
          <input class="text-input" id="decisionQuestion" type="text" maxlength="60" placeholder="例如：今晚吃什么？" autocomplete="off">
        </div>
        <div>
          <span class="field-label">答案选项</span>
          <div class="decision-option-list" id="decisionOptionList"></div>
        </div>
        <button class="decision-add-option" id="addDecisionOption" type="button">+ 添加选项</button>
        <div class="decision-answer-count-row">
          <span class="field-label">回答数量</span>
          <div class="decision-count-group" id="decisionAnswerCountGroup" role="group" aria-label="回答数量">
            ${[1, 2, 3, 4].map(count => `<button class="decision-count-btn${count === 1 ? ' active' : ''}" type="button" data-answer-count="${count}" aria-pressed="${count === 1}">${count}</button>`).join('')}
          </div>
        </div>
        <p class="decision-compose-hint">2–4 个选项，选项不要重复；回答数量不能超过选项数。</p>
      </div>
    `;
    els.sheetActions.innerHTML = `
      <button class="btn" type="button" data-sheet-action="close">取消</button>
      <button class="btn primary" id="sendDecisionBtn" type="button" disabled>提问</button>
    `;
    const optionList = $('#decisionOptionList');
    const addOptionBtn = $('#addDecisionOption');
    const sendBtn = $('#sendDecisionBtn');
    const questionInput = $('#decisionQuestion');
    const answerCountGroup = $('#decisionAnswerCountGroup');
    let selectedAnswerCount = 1;

    if (optionList) {
      optionList.append(decisionOptionRow('A'), decisionOptionRow('B'));
    }

    const updateCompose = () => {
      if (!optionList) return;
      const rows = [...optionList.querySelectorAll('.decision-option-row')];
      rows.forEach((row, index) => {
        const letter = String.fromCharCode(65 + index);
        const badge = row.querySelector('.decision-letter');
        const input = row.querySelector('.decision-option-input');
        const remove = row.querySelector('.decision-option-remove');
        if (badge) badge.textContent = letter;
        if (input) {
          input.placeholder = `选项 ${letter}`;
          input.setAttribute('aria-label', `选项 ${letter}`);
        }
        if (remove) {
          remove.hidden = rows.length <= 2;
          remove.setAttribute('aria-label', `删除选项 ${letter}`);
        }
      });
      if (addOptionBtn) addOptionBtn.disabled = rows.length >= 4;
      if (selectedAnswerCount > rows.length) selectedAnswerCount = rows.length;
      if (selectedAnswerCount < 1) selectedAnswerCount = 1;
      if (answerCountGroup) {
        answerCountGroup.querySelectorAll('[data-answer-count]').forEach(button => {
          const count = Number(button.dataset.answerCount);
          const active = count === selectedAnswerCount;
          button.disabled = count > rows.length;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
      }
      if (!sendBtn) return;
      const question = questionInput ? questionInput.value.trim() : '';
      const values = rows.map(row => row.querySelector('.decision-option-input').value.trim()).filter(Boolean);
      const unique = new Set(values.map(value => value.toLowerCase()));
      sendBtn.disabled = !question || values.length < 2 || unique.size !== values.length;
    };

    if (answerCountGroup) {
      answerCountGroup.addEventListener('click', event => {
        const button = event.target.closest('[data-answer-count]');
        if (!button || button.disabled) return;
        selectedAnswerCount = Number(button.dataset.answerCount);
        updateCompose();
      });
    }

    const addOption = () => {
      if (!optionList) return;
      if (optionList.querySelectorAll('.decision-option-row').length >= 4) return;
      optionList.appendChild(decisionOptionRow('A'));
      updateCompose();
      const inputs = optionList.querySelectorAll('.decision-option-input');
      const last = inputs[inputs.length - 1];
      if (last) last.focus({ preventScroll: true });
    };

    if (addOptionBtn) addOptionBtn.addEventListener('click', addOption);
    if (questionInput) questionInput.addEventListener('input', updateCompose);
    if (optionList) {
      optionList.addEventListener('input', updateCompose);
      optionList.addEventListener('click', event => {
        const remove = event.target.closest('.decision-option-remove');
        if (!remove) return;
        const row = remove.closest('.decision-option-row');
        const rows = optionList.querySelectorAll('.decision-option-row');
        if (!row || rows.length <= 2) return;
        row.remove();
        updateCompose();
      });
    }
    if (sendBtn) {
      sendBtn.addEventListener('click', () => {
        const question = questionInput ? questionInput.value.trim().slice(0, 60) : '';
        const options = optionList
          ? [...optionList.querySelectorAll('.decision-option-input')]
            .map(input => input.value.trim().slice(0, 20))
            .filter(Boolean)
          : [];
        const unique = new Set(options.map(value => value.toLowerCase()));
        if (!question || options.length < 2) {
          showToast('请填写问题和至少两个选项');
          return;
        }
        if (unique.size !== options.length) {
          showToast('答案选项不要重复');
          return;
        }
        const decision = {
          id: uid(),
          from: 'me',
          type: 'decision',
          question,
          options: options.map(text => ({ id: 'option-' + uid(), text })),
          answerCount: Math.min(selectedAnswerCount, options.length),
          at: Date.now()
        };
        addMessage(decision);
        closeSheet();
        enqueueDecisionReply(decision);
        showToast('问题已发出');
      });
    }

    updateCompose();
  }

  function makeDecisionBubble(message) {
    const bubble = document.createElement('div');
    bubble.className = 'decision-bubble';
    const head = document.createElement('div');
    head.className = 'decision-head';
    const tag = document.createElement('span');
    tag.className = 'decision-tag';
    tag.textContent = '提问';
    const count = document.createElement('span');
    count.className = 'decision-count-label';
    count.textContent = `选 ${message.answerCount || 1} 个`;
    head.append(tag, count);
    const question = document.createElement('p');
    question.className = 'decision-question';
    question.textContent = message.question;
    const options = document.createElement('div');
    options.className = 'decision-options';
    message.options.forEach((option, index) => {
      const item = document.createElement('div');
      item.className = 'decision-option';
      const letter = document.createElement('span');
      letter.className = 'decision-letter';

      letter.setAttribute('aria-hidden', 'true');

    });
