  function makeDecisionAnswerBubble(message) {
    const bubble = document.createElement('div');
    bubble.className = 'decision-answer-bubble';
    const head = document.createElement('div');
    head.className = 'decision-head';
    const tag = document.createElement('span');
    tag.className = 'decision-tag';
    tag.textContent = '回答';
    head.appendChild(tag);
    bubble.appendChild(head);
    if (message.question) {
      const question = document.createElement('p');
      question.className = 'decision-answer-question';
      question.textContent = message.question;
      bubble.appendChild(question);
    }
    const line = document.createElement('div');
    line.className = 'decision-answer-line';
    const check = document.createElement('span');
    check.className = 'decision-check';
    check.textContent = '✓';
    check.setAttribute('aria-hidden', 'true');
    const text = document.createElement('span');
    text.className = 'decision-answer-text';
    const answers = Array.isArray(message.answerTexts) && message.answerTexts.length
      ? message.answerTexts
      : [message.answerText];
    text.textContent = `选了${answers.map(answer => `「${answer}」`).join('')}`;
    line.append(check, text);
    bubble.appendChild(line);
    return bubble;
  }

  function makeMessageNode(message, previous, animate) {
    const fragment = document.createDocumentFragment();
    const dayChanged = !previous || startOfDay(previous.at) !== startOfDay(message.at);
    const gap = previous ? message.at - previous.at : Infinity;
    if (dayChanged) {
      const chip = document.createElement('div');
      chip.className = 'day-chip';
      chip.textContent = dayLabel(message.at);
      fragment.appendChild(chip);
    } else if (gap > 20 * 60 * 1000) {
      const chip = document.createElement('div');
      chip.className = 'day-chip';
      chip.textContent = timeLabel(message.at);
      fragment.appendChild(chip);
    }

    const row = document.createElement('div');
    const groupStart = dayChanged || !previous || previous.from !== message.from || gap > 3 * 60 * 1000;
    row.className = 'msg ' + (message.from === 'me' ? 'me' : 'them') +
      (groupStart ? ' group-start' : '') + (animate ? ' enter' : '');
    row.dataset.messageId = message.id;

    if (message.from === 'them') {
      if (groupStart) row.appendChild(makeAvatar());
      else {
        const spacer = document.createElement('div');
        spacer.className = 'avatar-spacer';
        spacer.setAttribute('aria-hidden', 'true');
        row.appendChild(spacer);
      }
    }

    const body = document.createElement('div');
    body.className = 'msg-body';

    if (message.type === 'text') {
      const bubble = document.createElement('div');
      bubble.className = 'text-bubble';
      bubble.textContent = message.text;
      body.appendChild(bubble);
    } else if (message.type === 'card') {
      const noEmoji = Boolean(message.noEmoji) || !message.cardEmoji;
      const bubble = document.createElement('div');
      bubble.className = 'card-bubble' + (message.combo ? ' combo' : '') + (noEmoji ? ' no-emoji' : '');
      const copy = document.createElement('span');
      copy.className = 'card-copy';
      const kind = document.createElement('span');
      kind.className = 'card-kind';
      kind.textContent = message.combo ? `拼字卡 · ${message.cardCount || 1}` : '字卡';
      const word = document.createElement('span');
      word.className = 'card-word';
      word.textContent = message.cardLabel;
      copy.append(kind, word);
      if (!noEmoji) {
        const emoji = document.createElement('span');
        emoji.className = 'card-emoji';
        emoji.textContent = message.cardEmoji;
        emoji.setAttribute('aria-hidden', 'true');
        bubble.appendChild(emoji);
      }
      bubble.appendChild(copy);
      const wrap = document.createElement('div');
      wrap.className = 'card-message';
      wrap.appendChild(bubble);
      const intentText = message.combo
        ? message.cardIntent || (Array.isArray(message.cardIntents) && message.cardIntents[0] ? message.cardIntents[0].intent : '')
        : message.cardIntent;
      if (intentText) {
        const intent = document.createElement('p');
        intent.className = 'card-intent';
        const label = document.createElement('span');
        label.className = 'card-intent-label';
        label.textContent = '对方的意图';
        const text = document.createElement('span');
        text.textContent = intentText;
        intent.append(label, text);
        wrap.appendChild(intent);
      }
      body.appendChild(wrap);
    } else if (message.type === 'decision') {
      body.appendChild(makeDecisionBubble(message));
    } else if (message.type === 'decisionAnswer') {
      body.appendChild(makeDecisionAnswerBubble(message));
    } else if (message.type === 'heart') {
      const bubble = document.createElement('div');
      bubble.className = 'heart-bubble';
      const heart = document.createElement('span');
      heart.className = 'heart-glyph';
      heart.textContent = '❤️';
      heart.setAttribute('aria-hidden', 'true');
      const text = document.createElement('span');
      text.textContent = '给你比个心';
      bubble.append(heart, text);
      body.appendChild(bubble);
    } else {
      const figure = document.createElement('figure');
      figure.className = 'sticker-bubble';
      const img = new Image();
      img.src = message.src;
      img.alt = '表情：' + (message.stickerName || '表情');
      img.draggable = false;
      figure.appendChild(img);
      body.appendChild(figure);
    }

    row.appendChild(body);
    fragment.appendChild(row);
    return fragment;
  }

    note.textContent = `直接打字，${contactName()}会按设置回复你。`;

  function assetWarningText() {
    return state.stickers.length
      ? `${contactName()}还没有字卡，只能用你准备的表情回应你。`
      : '字卡和表情都是空的，先添加一点内容吧。';
  }

  function updateAssetWarning() {
    const existing = els.chat.querySelector('.asset-warning');
    const needsWarning = state.cards.length === 0 && state.messages.length > 0;
    if (!needsWarning) {
      if (existing) existing.remove();
      return;
    }
    let warning = existing;
    if (!warning) {
      warning = document.createElement('div');
      warning.className = 'asset-warning';
      const copy = document.createElement('span');
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '去添加';
      button.addEventListener('click', () => openCollection('cards'));
      warning.append(copy, button);
    }
    const copy = warning.querySelector('span');
    if (copy) copy.textContent = assetWarningText();
    const typing = els.chat.querySelector('.typing-row');
    if (typing) els.chat.insertBefore(warning, typing);
    else els.chat.appendChild(warning);

  /* ————————————————————————————————
     Replies
  ———————————————————————————————— */
  function enqueueReply(sourceText) {
    replyQueue.push({ type: 'reply', sourceText: String(sourceText || '') });
    if (!replyRunning) {
      replyRunning = true;
      runReplyQueue(generation);
    }
  }

  function enqueueDecisionReply(decision) {
    replyQueue.push({ type: 'decision', decision });
    if (!replyRunning) {
      replyRunning = true;
      runReplyQueue(generation);
    }
  }

  function randomInt(min, max) {
    const low = Math.min(min, max);
    const high = Math.max(min, max);
    return low + Math.floor(Math.random() * (high - low + 1));
  }

  function pickReplyCards(count, extraAvoid) {
    if (!state.cards.length) return [];
    const limit = Math.max(1, Math.min(Math.round(count) || 1, state.cards.length));
    const recent = state.messages
      .filter(message => message.from === 'them' && message.type === 'card')
      .slice(-3)
      .map(message => message.cardId);
    const avoid = new Set(recent);
    if (extraAvoid) extraAvoid.forEach(id => avoid.add(id));
    let pool = state.cards.filter(card => !avoid.has(card.id));
    if (pool.length < limit) pool = [...state.cards];
    const picked = [];
    while (picked.length < limit && pool.length) {
      const index = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(index, 1)[0]);
    }
    return picked;
  }

  function pickStickerReply() {
    if (!state.stickers.length) return null;
    const lastPartnerSticker = [...state.messages]
      .reverse()
      .find(message => message.from === 'them' && message.type === 'sticker');
    let pool = state.stickers.filter(sticker => !lastPartnerSticker || sticker.id !== lastPartnerSticker.stickerId);
    if (!pool.length) pool = state.stickers;
    const weighted = [];
    for (const sticker of pool) {
      const weight = sticker.kind === 'custom' ? 3 : 1;
      for (let i = 0; i < weight; i += 1) weighted.push(sticker);
    }
    return randomOf(weighted);
  }

  function buildReplyPlan() {
    if (!state.cards.length) {
      const sticker = pickStickerReply();
      return sticker ? [{ type: 'sticker', sticker }] : [];
    }
    if (state.stickers.length && Math.random() < 0.28) {
      const sticker = pickStickerReply();
      if (sticker) return [{ type: 'sticker', sticker }];
    }
    const messageCount = randomInt(state.replySettings.messageMin, state.replySettings.messageMax);
    const used = new Set();
    const plan = [];
    for (let index = 0; index < messageCount; index += 1) {
      const cardCount = state.replySettings.merge
        ? randomInt(state.replySettings.cardMin, state.replySettings.cardMax)
        : 1;
      const cards = pickReplyCards(cardCount, used);
      if (!cards.length) break;
      cards.forEach(card => used.add(card.id));
      if (state.replySettings.merge && cards.length > 1) {
        plan.push({ type: 'combo', cards });
      } else {
        plan.push({ type: 'card', card: cards[0] });
      }
    }
    return plan;
  }

  function maybeSaveCardFromReply(sourceText, plan) {
    if (!state.replySettings.theyAddCards) return;
    if (Math.random() > 0.22) return;
    const choices = [];
    const combos = plan.filter(item => item.type === 'combo');
    if (combos.length) {
      const combo = randomOf(combos);
      choices.push({
        label: combo.cards.map(card => card.label).join('，'),
        emoji: combo.cards[0].emoji
      });
    }
    const text = String(sourceText || '').trim();
    if (text) {
      choices.push({
        label: text.slice(0, 40),
        emoji: randomOf([...EMOJIS, ...state.customEmojis])
      });
    }
    if (!choices.length) return;
    const choice = randomOf(choices);
    addThemCard(choice.label, choice.emoji);
  }

  function maybeAddIntentCard() {
    if (!state.replySettings.theyAddCards) return;
    if (Math.random() > 0.16) return;
    const candidates = state.cards.filter(card =>
      card.intent
      && !GENERIC_CARD_INTENTS.has(card.intent)
      && !state.cards.some(existing => existing.label.toLowerCase() === card.intent.toLowerCase())
    );
    if (!candidates.length) return;
    const chosen = randomOf(candidates);
    addThemCard(chosen.intent, '', {
      noEmoji: true,
      maxLength: 80,
      intent: '想把这句话留在你身边。',
      toastMessage: `${contactName()}把一句字卡意图收进了字卡库`
    });
  }

  function showTyping(text) {
    if (typingRow) {
      const label = typingRow.querySelector('.typing-text');
      if (label) label.textContent = text;
      return;
    }
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.appendChild(makeAvatar());
    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    const dots = document.createElement('span');
    dots.className = 'typing-dots';
    for (let i = 0; i < 3; i += 1) dots.appendChild(document.createElement('span'));
    const label = document.createElement('span');
    label.className = 'typing-text';
    label.textContent = text;
    bubble.append(dots, label);
    row.appendChild(bubble);
    els.chat.appendChild(row);
    typingRow = row;
    scrollBottom('smooth');

  function hideTyping() {
    if (typingRow) {
      typingRow.remove();
      typingRow = null;
    }
    const stray = els.chat.querySelector('.typing-row');
    if (stray) stray.remove();

  async function runReplyQueue(token) {
    try {
      while (replyQueue.length && token === generation) {
        const item = replyQueue.shift();
        if (item && item.type === 'decision') {
          const delaySeconds = state.replySettings.delayMin
            + Math.random() * (state.replySettings.delayMax - state.replySettings.delayMin);
          const delayMs = Math.max(300, Math.round(delaySeconds * 1000));
          showTyping('正在选答案…');
          await sleep(delayMs);
          if (token !== generation) return;
          hideTyping();
          const options = item.decision.options || [];
          if (options.length) {
            const answerCount = Math.min(item.decision.answerCount || 1, options.length);
            const pool = [...options];
            const picks = [];
            while (picks.length < answerCount && pool.length) {
              const index = Math.floor(Math.random() * pool.length);
              picks.push(pool.splice(index, 1)[0]);
            }
            if (picks.length) {
              addMessage({
                id: uid(),
                from: 'them',
                type: 'decisionAnswer',
                questionId: item.decision.id,
                question: item.decision.question,
                answerId: picks[0].id,
                answerTexts: picks.map(option => option.text),
                answerText: picks.map(option => option.text).join('，'),
                at: Date.now()
              });
            }
          }
          await sleep(120 + Math.random() * 120);
          continue;
        }
        const sourceText = item && item.type === 'reply' ? item.sourceText : '';
        const plan = buildReplyPlan();
        if (!plan.length) {
          updateAssetWarning();
          continue;
        }
        for (const reply of plan) {
          const delaySeconds = state.replySettings.delayMin
            + Math.random() * (state.replySettings.delayMax - state.replySettings.delayMin);
          const delayMs = Math.max(300, Math.round(delaySeconds * 1000));
          const typingText = reply.type === 'sticker'
            ? '正在翻表情…'
            : reply.type === 'combo'
              ? '正在拼字卡…'
              : '正在挑字卡…';
          showTyping(typingText);
          await sleep(delayMs);
          if (token !== generation) return;
          hideTyping();
          if (reply.type === 'sticker') {
            addMessage({
              id: uid(),
              from: 'them',
              type: 'sticker',
              stickerId: reply.sticker.id,
              stickerName: reply.sticker.name,
              src: reply.sticker.src,
              at: Date.now()
            });
          } else if (reply.type === 'combo') {
            const first = reply.cards[0];
            const emojiCard = reply.cards.find(card => card.emoji && !card.noEmoji);
            const intentCards = reply.cards.filter(card => card.intent);
            const intentCard = intentCards.length ? randomOf(intentCards) : null;
            addMessage({
              id: uid(),
              from: 'them',
              type: 'card',
              cardId: first.id,
              cardLabel: reply.cards.map(card => card.label).join('，'),
              cardEmoji: emojiCard ? emojiCard.emoji : '',
              noEmoji: !emojiCard,
              combo: true,
              cardCount: reply.cards.length,
              cardIntent: intentCard ? intentCard.intent : FALLBACK_CARD_INTENT,
              at: Date.now()
            });
          } else {
            const noEmoji = Boolean(reply.card.noEmoji) || !reply.card.emoji;
            addMessage({
              id: uid(),
              from: 'them',
              type: 'card',
              cardId: reply.card.id,
              cardLabel: reply.card.label,
              cardEmoji: noEmoji ? '' : reply.card.emoji,
              noEmoji,
              cardIntent: reply.card.intent || FALLBACK_CARD_INTENT,
              at: Date.now()
            });
          }
          await sleep(120 + Math.random() * 120);
        }
        maybeSaveCardFromReply(sourceText, plan);
        maybeAddIntentCard();
      }
    } finally {
      if (token === generation) {
        replyRunning = false;
        hideTyping();
      }
    }
  }

  function padDatePart(value) {
    return String(value).padStart(2, '0');
  }

  function formatDateDot(date) {
    return `${date.getFullYear()}.${padDatePart(date.getMonth() + 1)}.${padDatePart(date.getDate())}`;
  }

  function anniversaryYearLabel(years) {
    if (years === 1) return '一周年';
    if (years === 2) return '两周年';
    if (years === 3) return '三周年';
    return `${years} 周年`;
  }

  function anniversaryPreviewHtml(value) {
    const start = parseDateOnly(value);
    if (!start) return '<p class="anniversary-placeholder">选一个开始的日子，记下你们在一起的第几天。</p>';
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (start > today) return '<p class="anniversary-warning">纪念日不能晚于今天。</p>';
    const days = Math.floor((today - start) / 86400000) + 1;
    const isHundred = days % 100 === 0;
    const nextHundred = isHundred ? days : Math.ceil(days / 100) * 100;
    const hundredText = isHundred
      ? `今天是第 ${days} 天`
      : `距离第 ${nextHundred} 天还有 ${nextHundred - days} 天`;

    let nextYear = today.getFullYear();
    let nextDate = new Date(nextYear, start.getMonth(), start.getDate());
    let years = nextYear - start.getFullYear();
    const isAnniversary = nextDate.getTime() === today.getTime() && today.getFullYear() > start.getFullYear();
    if (isAnniversary) {
      years = today.getFullYear() - start.getFullYear();
    } else if (nextDate <= today) {
      nextYear += 1;
      nextDate = new Date(nextYear, start.getMonth(), start.getDate());
      years = nextYear - start.getFullYear();
    }
    const daysUntil = Math.round((nextDate - today) / 86400000);
    const yearText = isAnniversary
      ? `今天是${anniversaryYearLabel(years)}`
      : `距离${anniversaryYearLabel(years)}还有 ${daysUntil} 天`;

    return `
      <div class="anniversary-card">
        <span class="anniversary-eyebrow">我们在一起</span>
        <strong class="anniversary-days">第 ${days} 天</strong>
        <span class="anniversary-date">从 ${formatDateDot(start)} 开始</span>
        <div class="anniversary-milestones">
          <span>${hundredText}</span>
          <span>${yearText}</span>
        </div>
      </div>
    `;
  }

  function renderPromisesSheet() {
    els.sheetTitle.textContent = '我们的小约定';
    els.sheetBody.innerHTML = `
      <div class="promise-progress">
        <span id="promiseProgressText">还没有小约定</span>
        <div class="promise-bar"><span id="promiseBarFill"></span></div>
      </div>
      <div class="promise-list" id="promiseList"></div>
      <div class="promise-add-row">
        <input class="promise-input" id="promiseInput" type="text" maxlength="40" placeholder="想一起做的事…" autocomplete="off" aria-label="新的小约定">
        <button class="promise-add" id="addPromiseBtn" type="button">添加</button>
      </div>
      <p class="decision-compose-hint">写下你们想一起完成的小事。</p>
    `;
    els.sheetActions.innerHTML = '<button class="btn primary" type="button" data-sheet-action="close">完成</button>';
    const list = $('#promiseList');
    const input = $('#promiseInput');
    const addBtn = $('#addPromiseBtn');
    const progressText = $('#promiseProgressText');
    const barFill = $('#promiseBarFill');

    const refresh = () => {
      const total = state.promises.length;
      const done = state.promises.filter(item => item.done).length;
      if (progressText) progressText.textContent = total ? `完成 ${done} / ${total}` : '还没有小约定';
      if (barFill) barFill.style.width = total ? `${done / total * 100}%` : '0%';
      if (!list) return;
      list.innerHTML = '';
      if (!total) {
        const empty = document.createElement('div');
        empty.className = 'promise-empty';
        const copy = document.createElement('p');
        copy.textContent = '从一件小事开始吧';
        const suggestions = document.createElement('div');
        suggestions.className = 'promise-suggestions';
        PROMISE_SUGGESTIONS.forEach(text => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'promise-suggestion';
          button.dataset.promiseSuggestion = text;
          button.textContent = text;
          suggestions.appendChild(button);
        });
        empty.append(copy, suggestions);
        list.appendChild(empty);
        return;
      }
      state.promises.forEach(item => {
        const row = document.createElement('div');
        row.className = 'promise-item' + (item.done ? ' done' : '');
        const check = document.createElement('button');
        check.type = 'button';
        check.className = 'promise-check';
        check.dataset.promiseToggle = item.id;
        check.setAttribute('aria-label', item.done ? '标记为未完成' : '标记为完成');
        check.setAttribute('aria-pressed', String(item.done));
        check.textContent = item.done ? '✓' : '';
        const text = document.createElement('span');
        text.className = 'promise-text';
        text.textContent = item.text;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'promise-del';
        remove.dataset.promiseDelete = item.id;
        remove.setAttribute('aria-label', '删除小约定');
        remove.textContent = '×';
        row.append(check, text, remove);
        list.appendChild(row);
      });
    };

    const addPromise = (raw) => {
      const text = String(raw || '').trim().slice(0, 40);
      if (!text) return;
      if (state.promises.length >= MAX_PROMISES) {
        showToast(`最多保存 ${MAX_PROMISES} 条小约定`);
        return;
      }
      if (state.promises.some(item => item.text.toLowerCase() === text.toLowerCase())) {
        showToast('这条小约定已经在清单里了');
        return;
      }
      state.promises.push({
        id: 'promise-' + uid(),
        text,
        done: false,
        createdAt: Date.now()
      });
      persistPromises();
      refresh();
      if (input) {
        input.value = '';
        input.focus({ preventScroll: true });
      }
    };

    if (addBtn) addBtn.addEventListener('click', () => addPromise(input ? input.value : ''));
    if (input) {
      input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.isComposing) {
          event.preventDefault();
          addPromise(input.value);
        }
      });
    }
    if (list) {
      list.addEventListener('click', event => {
        const suggestion = event.target.closest('[data-promise-suggestion]');
        if (suggestion) {
          addPromise(suggestion.dataset.promiseSuggestion);
          return;
        }
        const toggle = event.target.closest('[data-promise-toggle]');
        if (toggle) {
          const item = state.promises.find(entry => entry.id === toggle.dataset.promiseToggle);
          if (!item) return;
          item.done = !item.done;
          persistPromises();
          refresh();
          if (item.done && state.promises.length && state.promises.every(entry => entry.done)) {
            showToast('小约定全部完成啦');
          }
          return;
        }
        const remove = event.target.closest('[data-promise-delete]');
        if (remove) {
          state.promises = state.promises.filter(entry => entry.id !== remove.dataset.promiseDelete);
          persistPromises();
          refresh();
        }
      });
    }
    refresh();
  }

  function renderMoments() {
    if (!els.momentList) return;
    els.momentsName.textContent = contactName();
    els.momentsAvatar.src = state.contact.avatar;
    els.momentsAvatar.alt = contactName();
    els.momentList.innerHTML = '';

    const moments = [...state.moments].sort((a, b) => b.at - a.at);
    if (!moments.length) {
      const empty = document.createElement('div');
      empty.className = 'moments-empty';
      const strong = document.createElement('strong');
      strong.textContent = '还没有朋友圈内容';
      const copy = document.createElement('span');
      copy.textContent = '点右上角「发布」，记录一点今天的事。';
      empty.append(strong, copy);
      els.momentList.appendChild(empty);
      return;
    }

    for (const moment of moments) {
      const article = document.createElement('article');
      article.className = 'moment';
      article.appendChild(makeMomentAvatar(moment.author));

      const main = document.createElement('div');
      main.className = 'moment-main';
      const author = document.createElement('p');
      author.className = 'moment-author';
      author.textContent = moment.author === 'me' ? '我' : contactName();
      main.appendChild(author);

      if (moment.text) {
        const text = document.createElement('p');
        text.className = 'moment-text';
        text.textContent = moment.text;
        main.appendChild(text);
      }

      if (moment.image) {
        if (moment.imageKind === 'sticker') {
          const wrap = document.createElement('div');
          wrap.className = 'moment-sticker';
          const img = new Image();
          img.src = moment.image;
          img.alt = '表情';
          wrap.appendChild(img);
          main.appendChild(wrap);
        } else {
          const img = new Image();
          img.className = 'moment-photo';
          img.src = moment.image;
          img.alt = '朋友圈图片';
          main.appendChild(img);
        }
      }

      const meta = document.createElement('div');
      meta.className = 'moment-meta';
      const time = document.createElement('time');
      time.textContent = relativeTime(moment.at);
      meta.appendChild(time);

      const like = document.createElement('button');
      like.type = 'button';
      like.className = 'moment-like' + (moment.liked ? ' liked' : '');
      like.dataset.likeId = moment.id;
      like.setAttribute('aria-pressed', String(moment.liked));
      like.setAttribute('aria-label', moment.liked ? '取消点赞' : '点赞');
      like.title = moment.liked ? '取消点赞' : '点赞';
      like.innerHTML = ICON.heart;
      const likeCount = document.createElement('span');
      likeCount.textContent = String(moment.likes);
      like.appendChild(likeCount);
      meta.appendChild(like);

      const dislike = document.createElement('button');
      dislike.type = 'button';
      dislike.className = 'moment-dislike' + (moment.disliked ? ' disliked' : '');
      dislike.dataset.dislikeId = moment.id;
      dislike.setAttribute('aria-pressed', String(moment.disliked));
      dislike.setAttribute('aria-label', moment.disliked ? '取消点踩' : '点踩');
      dislike.title = moment.disliked ? '取消点踩' : '点踩';
      dislike.innerHTML = ICON.thumbDown;
      const dislikeCount = document.createElement('span');
      dislikeCount.textContent = String(moment.dislikes);
      dislike.appendChild(dislikeCount);
      meta.appendChild(dislike);

      const commentToggle = document.createElement('button');
      commentToggle.type = 'button';
      commentToggle.className = 'moment-comment-btn' + (state.commentingMomentId === moment.id ? ' active' : '');
      commentToggle.dataset.commentId = moment.id;
      commentToggle.setAttribute('aria-expanded', String(state.commentingMomentId === moment.id));
      commentToggle.setAttribute('aria-label', '评论');
      commentToggle.title = '评论';
      commentToggle.innerHTML = ICON.comment;
      const commentCount = document.createElement('span');
      commentCount.textContent = String(moment.comments.length);
      commentToggle.appendChild(commentCount);
      meta.appendChild(commentToggle);

      if (moment.author === 'me') {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'moment-delete';
        remove.dataset.deleteMoment = moment.id;
        remove.textContent = '删除';
        meta.appendChild(remove);
      }

      main.appendChild(meta);

      const showComments = moment.comments.length > 0 || state.commentingMomentId === moment.id;
      if (showComments) {
        const block = document.createElement('div');
        block.className = 'moment-comments';
        moment.comments.forEach(comment => {
          const row = document.createElement('div');
          row.className = 'moment-comment';
          const authorName = document.createElement('b');
          authorName.textContent = comment.author === 'me' ? '我' : contactName();
          const text = document.createElement('span');
          text.textContent = comment.text;
          row.append(authorName, text);
          block.appendChild(row);
        });
        if (state.commentingMomentId === moment.id) {
          const form = document.createElement('form');
          form.className = 'comment-form';
          form.dataset.commentForm = moment.id;
          const input = document.createElement('input');
          input.className = 'comment-input';
          input.type = 'text';
          input.maxLength = 160;
          input.placeholder = '写评论…';
          input.dataset.commentInput = 'true';
          input.setAttribute('aria-label', '评论内容');
          const submit = document.createElement('button');
          submit.className = 'comment-submit';
          submit.type = 'submit';
          submit.textContent = '发送';
          form.append(input, submit);
          block.appendChild(form);
        }
        main.appendChild(block);
      }

      article.appendChild(main);
      els.momentList.appendChild(article);
    }

    if (state.commentingMomentId && state.view === 'moments') {
      const input = els.momentList.querySelector('[data-comment-input]');
      if (input) requestAnimationFrame(() => input.focus({ preventScroll: true }));
    }
  }

  function toggleLike(id) {
    const moment = state.moments.find(item => item.id === id);
    if (!moment) return;
    if (moment.liked) {
      moment.liked = false;
      moment.likes = Math.max(0, moment.likes - 1);
    } else {
      moment.liked = true;
      moment.likes += 1;
      if (moment.disliked) {
        moment.disliked = false;
        moment.dislikes = Math.max(0, moment.dislikes - 1);
      }
    }
    persistMoments();
    renderMoments();
  }

  function toggleDislike(id) {
    const moment = state.moments.find(item => item.id === id);
    if (!moment) return;
    if (moment.disliked) {
      moment.disliked = false;
      moment.dislikes = Math.max(0, moment.dislikes - 1);
    } else {
      moment.disliked = true;
      moment.dislikes += 1;
      if (moment.liked) {
        moment.liked = false;
        moment.likes = Math.max(0, moment.likes - 1);
      }
    }
    persistMoments();
    renderMoments();
  }

  function toggleCommentComposer(id) {
    state.commentingMomentId = state.commentingMomentId === id ? null : id;
    renderMoments();
  }

  function addMomentComment(id, text) {
    const moment = state.moments.find(item => item.id === id);
    if (!moment) return;
    const value = text.trim().slice(0, 160);
    if (!value) return;
    if (!Array.isArray(moment.comments)) moment.comments = [];
    moment.comments.push({
      id: uid(),
      author: 'me',
      text: value,
      at: Date.now()
    });
    state.commentingMomentId = null;
    persistMoments();
    renderMoments();
    showToast('评论已发布');
  }

  function deleteMoment(id) {
    const index = state.moments.findIndex(item => item.id === id);
    if (index < 0) return;
    const moment = state.moments[index];
    if (moment.author !== 'me') return;
    state.moments.splice(index, 1);
    if (state.commentingMomentId === id) state.commentingMomentId = null;
    persistMoments();
    renderMoments();
    showToast('已删除这条朋友圈', '撤销', () => {
      state.moments.splice(Math.min(index, state.moments.length), 0, moment);

  function openCollection(tab = 'cards') {
    closeMenu();
    if (document.activeElement === els.messageInput) els.messageInput.blur();
    lastFocusCollection = document.activeElement;
    els.collectionLayer.hidden = false;
    setCollectionTab(tab, { closeForm: true });
    adjustCollectionHeight();
    requestAnimationFrame(() => els.collectionSheet.focus({ preventScroll: true }));
  }

  function closeCollection(options = {}) {
    if (els.collectionLayer.hidden) return;
    const restoreFocus = options.restoreFocus !== false;
    els.collectionLayer.hidden = true;
    closeInlineCardForm();
    if (restoreFocus && lastFocusCollection && document.contains(lastFocusCollection)) {
      try { lastFocusCollection.focus({ preventScroll: true }); } catch (_) {}
    }
    lastFocusCollection = null;
  }

  function adjustCollectionHeight() {
    if (els.collectionLayer.hidden) return;
    const layerHeight = els.collectionLayer.clientHeight;
    if (!layerHeight) return;
    const maxHeight = Math.min(Math.round(layerHeight * 0.82), 680);
    const minHeight = Math.min(340, maxHeight);
    const grabber = els.collectionSheet.querySelector('.grabber');
    const head = els.collectionSheet.querySelector('.sheet-head');
    const bar = els.collectionSheet.querySelector('.collection-bar');
    const activeGrid = state.collectionTab === 'cards' ? els.cardLibrary : els.stickerLibrary;
    if (!grabber || !head || !bar || !activeGrid) return;
    const style = getComputedStyle(els.collectionSheet);
    const paddingTop = parseFloat(style.paddingTop) || 0;
    const paddingBottom = parseFloat(style.paddingBottom) || 0;
    const formHeight = els.inlineCardForm.hidden ? 0 : els.inlineCardForm.offsetHeight + 9;
    const bodyHeight = 2 + activeGrid.scrollHeight + 3;
    const desired = paddingTop + grabber.offsetHeight + 13 + head.offsetHeight + bar.offsetHeight +
      formHeight + bodyHeight + paddingBottom;
    const height = Math.max(minHeight, Math.min(maxHeight, Math.round(desired)));
    els.collectionSheet.style.height = height + 'px';
  }

  function updateCollectionAddLabel() {
    const processing = importing;
    els.collectionAdd.disabled = processing;
    els.collectionAdd.classList.remove('is-open');
    if (state.collectionTab === 'stickers') {
      els.collectionAdd.textContent = processing ? '处理中…' : '+ 添加表情';
      return;
    }
    const open = !els.inlineCardForm.hidden;
    if (open && !processing) {
      els.collectionAdd.textContent = '收起';
      els.collectionAdd.classList.add('is-open');
    } else {
      els.collectionAdd.textContent = processing ? '处理中…' : '+ 添加字卡';
    }

    if (tab !== 'cards' && tab !== 'stickers') return;
    state.collectionTab = tab;
    const isCards = tab === 'cards';
    els.collectionTabCards.classList.toggle('active', isCards);
    els.collectionTabStickers.classList.toggle('active', !isCards);
    els.collectionTabCards.setAttribute('aria-selected', String(isCards));
    els.collectionTabStickers.setAttribute('aria-selected', String(!isCards));
    els.collectionTabCards.tabIndex = isCards ? 0 : -1;
    els.collectionTabStickers.tabIndex = isCards ? -1 : 0;
    els.cardLibrary.hidden = !isCards;
    els.stickerLibrary.hidden = isCards;

  async function handleStickerFiles(fileList) {
    if (importing) return;
    const files = Array.from(fileList || []);
    if (!files.length) return;
    const room = MAX_STICKERS - state.stickers.length;
    if (room <= 0) {
      showToast(`最多保存 ${MAX_STICKERS} 张表情`);
      return;
    }
    const usable = files.filter(isImageFile);
    if (!usable.length) {
      showToast('请选择图片文件');
      return;
    }
    if (usable.length > room) showToast(`最多再添加 ${room} 张，已选取前面的图片`);

    importing = true;
    updateCollectionAddLabel();
    const added = [];
    let failed = 0;

    for (const file of usable.slice(0, room)) {
      try {
        if (file.size > MAX_FILE_BYTES) throw new Error('too large');
        const dataUrl = await readAsDataURL(file);
        const img = await loadImage(dataUrl);
        const src = compressSticker(img);
        const name = file.name.replace(/\.[^.]+$/, '').trim().slice(0, 24) || '我的表情';
        added.push({
          id: 'custom-' + uid(),
          kind: 'custom',
          name,
          src,
          createdAt: Date.now()
        });
      } catch (_) {
        failed += 1;
      }
    }

    importing = false;
    updateCollectionAddLabel();

    if (added.length) {
      state.stickers.unshift(...added);
      persistStickers();
      setCollectionTab('stickers', { closeForm: true });
      updateCounts();
      adjustCollectionHeight();
      els.collectionBody.scrollTop = 0;
      showToast(added.length === 1 ? '已添加 1 张表情' : `已添加 ${added.length} 张表情`);
    }
    if (failed) showToast(failed === 1 ? '有 1 张图片无法读取' : `有 ${failed} 张图片无法读取`);
    els.stickerInput.value = '';
  }

    const [sticker] = state.stickers.splice(index, 1);

     Toast
  ———————————————————————————————— */
  function showToast(message, actionLabel, onAction) {
    if (toastTimer) clearTimeout(toastTimer);
    els.toast.innerHTML = '';
    const label = document.createElement('span');
    label.textContent = message;
    els.toast.appendChild(label);
    if (actionLabel) {
      const action = document.createElement('button');
      action.type = 'button';
      action.textContent = actionLabel;
      action.addEventListener('click', () => {
        hideToast();
        if (typeof onAction === 'function') onAction();
      });
      els.toast.appendChild(action);
    }
    els.toast.classList.remove('show');
    void els.toast.offsetWidth;
    els.toast.classList.add('show');
    toastTimer = setTimeout(hideToast, actionLabel ? 4200 : 2200);
  }

  function hideToast() {
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = null;
    els.toast.classList.remove('show');
  }

  /* ————————————————————————————————
     Focus trap
  ———————————————————————————————— */
  function trapFocus(container, event) {
    const focusable = Array.from(container.querySelectorAll('button:not(:disabled), [href], input:not(:disabled), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])'))
      .filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    const active = document.activeElement;
    if (!focusable.includes(active)) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus();
    } else if (event.shiftKey && active === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && active === last) {
      event.preventDefault();
      first.focus();
    }
  }

  /* ————————————————————————————————
     Events
  ———————————————————————————————— */
  function bindEvents() {
    els.messageForm.addEventListener('submit', event => {
      event.preventDefault();
      if (state.composing) return;
      sendText();
    });
    els.sendBtn.addEventListener('click', sendText);
    els.messageInput.addEventListener('input', updateSendButton);
    els.messageInput.addEventListener('compositionstart', () => { state.composing = true; });
    els.messageInput.addEventListener('compositionend', () => {
      state.composing = false;
      updateSendButton();
    });
    els.messageInput.addEventListener('keyup', updateSendButton);
    els.messageInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        sendText();
      }
    });

    els.contactBtn.addEventListener('click', () => openSheet('contact'));
    els.momentsBtn.addEventListener('click', openMoments);
    els.mailBtn.addEventListener('click', openMailbox);
    els.moreBtn.addEventListener('click', event => {
      event.stopPropagation();
      toggleMenu();
    });
    els.menu.addEventListener('click', event => {
      const button = event.target.closest('[data-menu]');
      if (!button) return;
      closeMenu();
      const action = button.dataset.menu;
      if (action === 'contact') openSheet('contact');
      else if (action === 'anniversary') openSheet('anniversary');
      else if (action === 'promises') openSheet('promises');
      else if (action === 'dailyLove') openSheet('dailyLove');
      else if (action === 'reply') openSheet('reply');
      else if (action === 'info') openSheet('info');
      else if (action === 'reset') openSheet('reset');
    });
    document.addEventListener('click', event => {
      if (els.menu.hidden) return;
      if (event.target.closest('#menu') || event.target.closest('#moreBtn')) return;
      closeMenu();
    });

    els.cardsChip.addEventListener('click', () => openCollection('cards'));
    els.stickersChip.addEventListener('click', () => openCollection('stickers'));
    els.decisionBtn.addEventListener('click', () => openSheet('decision'));
    els.heartBtn.addEventListener('click', sendHeart);
    els.momentsBack.addEventListener('click', openChat);
    els.composeMomentBtn.addEventListener('click', () => openSheet('moment'));
    els.mailBack.addEventListener('click', openChat);
    els.composeLetterBtn.addEventListener('click', () => openSheet('letter'));

    els.momentList.addEventListener('click', event => {
      const like = event.target.closest('[data-like-id]');
      if (like) {
        toggleLike(like.dataset.likeId);
        return;
      }
      const dislike = event.target.closest('[data-dislike-id]');
      if (dislike) {
        toggleDislike(dislike.dataset.dislikeId);
        return;
      }
      const comment = event.target.closest('[data-comment-id]');
      if (comment) {
        toggleCommentComposer(comment.dataset.commentId);
        return;
      }
      const remove = event.target.closest('[data-delete-moment]');
      if (remove) deleteMoment(remove.dataset.deleteMoment);
    });
    els.momentList.addEventListener('submit', event => {
      const form = event.target.closest('[data-comment-form]');
      if (!form) return;
      event.preventDefault();
      const input = form.querySelector('[data-comment-input]');
      if (!input) return;
      addMomentComment(form.dataset.commentForm, input.value);
    });

    els.collectionClose.addEventListener('click', () => closeCollection());
    els.collectionLayer.addEventListener('click', event => {
      if (event.target.closest('[data-close-collection]')) closeCollection();
    });
    els.collectionTabCards.addEventListener('click', () => setCollectionTab('cards'));
    els.collectionTabStickers.addEventListener('click', () => setCollectionTab('stickers'));
    [els.collectionTabCards, els.collectionTabStickers].forEach(button => {
      button.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        setCollectionTab(state.collectionTab === 'cards' ? 'stickers' : 'cards');
        (state.collectionTab === 'cards' ? els.collectionTabCards : els.collectionTabStickers).focus();
      });
    });

    els.collectionAdd.addEventListener('click', () => {
      if (state.collectionTab === 'stickers') openStickerPicker();
      else if (els.inlineCardForm.hidden) openInlineCardForm();
      else closeInlineCardForm();
    });
    els.addCardSubmit.addEventListener('click', addCardFromForm);
    els.cardInput.addEventListener('input', updateAddCardState);
    els.cardInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        addCardFromForm();
      }
    });
    els.emojiPicker.addEventListener('click', event => {
      const button = event.target.closest('[data-emoji]');
      if (!button) return;
      selectDraftEmoji(button.dataset.emoji);
    });
    els.customEmojiAdd.addEventListener('click', addCustomEmoji);
    els.customEmojiInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        addCustomEmoji();
      }
    });
    els.cardGroupPicker.addEventListener('click', event => {
      const button = event.target.closest('[data-card-group]');
      if (!button) return;
      state.draftGroup = normalizeCardGroup(button.dataset.cardGroup);
      updateGroupChoices();
    });
    els.newGroupBtn.addEventListener('click', openNewGroupForm);
    els.saveGroupBtn.addEventListener('click', saveNewGroup);
    els.cancelGroupBtn.addEventListener('click', closeNewGroupForm);
    els.newGroupInput.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        saveNewGroup();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        closeNewGroupForm();
      }
    });

    els.cardLibrary.addEventListener('click', event => {
      const remove = event.target.closest('[data-delete-card]');
      if (remove) {
        deleteCard(remove.dataset.deleteCard);
        return;
      }
      const card = event.target.closest('[data-edit-card]');
      if (card) openCardIntent(card.dataset.editCard);
    });
    els.cardLibrary.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      if (event.target.closest('[data-delete-card]')) return;
      const card = event.target.closest('[data-edit-card]');
      if (!card) return;
      event.preventDefault();
      openCardIntent(card.dataset.editCard);
    });
    els.stickerLibrary.addEventListener('click', event => {
      const remove = event.target.closest('[data-delete-sticker]');
      if (remove) {
        deleteSticker(remove.dataset.deleteSticker);
        return;
      }
      if (event.target.closest('[data-add-sticker]')) openStickerPicker();
    });

    els.stickerInput.addEventListener('change', event => handleStickerFiles(event.target.files));

    els.avatarInput.addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (state.sheetMode !== 'contact' || !state.contactDraft || !file) return;
      if (!isImageFile(file)) {
        showToast('请选择图片文件');
        return;
      }
      if (file.size > MAX_FILE_BYTES) {
        showToast('图片太大了，请选择 12MB 以内的图片');
        return;
      }
      try {
        const dataUrl = await readAsDataURL(file);
        const img = await loadImage(dataUrl);
        state.contactDraft.avatar = compressAvatar(img);
        updateContactPreview();
        showToast('头像已选择，保存后生效');
      } catch (_) {
        showToast('头像读取失败，请换一张试试');
      } finally {
        els.avatarInput.value = '';
      }
    });

    els.momentImageInput.addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (state.sheetMode !== 'moment' || !file) return;
      if (!isImageFile(file)) {
        showToast('请选择图片文件');
        return;
      }
      if (file.size > MAX_FILE_BYTES) {
        showToast('图片太大了，请选择 12MB 以内的图片');
        return;
      }
      try {
        const dataUrl = await readAsDataURL(file);
        const img = await loadImage(dataUrl);
        state.momentDraft.image = compressMomentPhoto(img);
        updateMomentDraftImage();
        updateMomentPublishState();
      } catch (_) {
        showToast('图片读取失败，请换一张试试');
      } finally {
        els.momentImageInput.value = '';
      }
    });

    els.sheetClose.addEventListener('click', closeSheet);
    els.sheetLayer.addEventListener('click', event => {
      if (event.target.closest('[data-close-sheet]')) {
        closeSheet();
        return;
      }
      const action = event.target.closest('[data-sheet-action]');
      if (!action) return;
      const value = action.dataset.sheetAction;
      if (value === 'close') closeSheet();
      else if (value === 'reset') resetConversation();
      else if (value === 'save-contact') saveContactFromSheet();
      else if (value === 'publish-moment') publishMomentFromSheet();
      else if (value === 'send-letter') sendLetterFromSheet();
    });
    els.sheetBody.addEventListener('click', event => {
      if (event.target.closest('#changeAvatarBtn')) {
        els.avatarInput.value = '';
        els.avatarInput.click();
      } else if (event.target.closest('#resetAvatarBtn')) {
        if (state.contactDraft) {
          state.contactDraft.avatar = DEFAULT_AVATAR;
          updateContactPreview();
        }
      }
    });

    document.addEventListener('keydown', event => {
      if (!els.sheetLayer.hidden) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeSheet();
          return;
        }
        if (event.key === 'Tab') trapFocus(els.sheet, event);
        return;
      }
      if (!els.collectionLayer.hidden) {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeCollection();
          return;
        }
        if (event.key === 'Tab') trapFocus(els.collectionSheet, event);
        return;
      }
      if (!els.menu.hidden && event.key === 'Escape') {
        closeMenu();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && typingRow) hideTyping();
      if (!document.hidden) checkMailDelivery();
    });

    window.addEventListener('focus', () => checkMailDelivery());

    window.addEventListener('resize', () => {
      if (!els.collectionLayer.hidden) adjustCollectionHeight();
    });

    window.addEventListener('beforeunload', () => {
      persistMessages();
      persistCards();
      persistStickers();
      persistContact();
      persistAnniversary();
      persistPromises();
      persistDailyLove();
      persistMoments();
      persistLetters();
      persistCustomGroups();
      persistCustomEmojis();
      persistReplySettings();
    });
  }

  /* ————————————————————————————————
     Init
  ———————————————————————————————— */
  function init() {
    loadContact();
    loadAnniversary();
    loadPromises();
    loadDailyLove();
    loadCustomGroups();
    loadCustomEmojis();
    loadReplySettings();
    loadCards();
    loadStickers();
    const hasMessages = loadMessages();
    if (!hasMessages) {
      state.messages = seedMessages();
      persistMessages();
    }
    loadMoments();
    state.momentSignature = safeGet(KEYS.momentSignature) || '';
    if (!state.momentSignature) {
      state.momentSignature = assetSignature();
      safeSet(KEYS.momentSignature, state.momentSignature);
    }
    initMail();

    renderChat();
    renderCardLibrary();
    renderStickerLibrary();
    renderMoments();
    renderMailbox();
    renderEmojiPicker();
    renderGroupChoices();
    updateCounts();
    updateSendButton();
    applyContactUI();
    bindEvents();
    scrollBottom('auto');

    setInterval(() => {
      if (state.view === 'mail') updateNextMailLabel();
    }, 60000);
  }

  init();
})();
</script>
